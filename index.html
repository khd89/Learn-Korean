<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국어 배우기 · Learn Korean</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e42;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #7878a0;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }

    .logo { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .logo-kr { font-size: 1.5rem; }

    nav { display: flex; gap: 6px; }
    nav button {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 7px 16px; border-radius: 8px; cursor: pointer;
      font-size: .875rem; font-weight: 500; transition: all .2s;
    }
    nav button:hover { color: var(--text); border-color: var(--border); }
    nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    main { flex: 1; padding: 32px 24px; max-width: 900px; margin: 0 auto; width: 100%; }

    /* ── Home / Landing ── */
    .home { text-align: center; }
    .home h1 { font-size: 3rem; margin-bottom: 8px; }
    .home h1 span { color: var(--accent); }
    .home p { color: var(--muted); margin-bottom: 40px; font-size: 1.1rem; }

    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;
    }
    .module-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px; text-align: left;
      cursor: pointer; transition: all .25s; position: relative; overflow: hidden;
    }
    .module-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .module-card.c1::before { background: var(--accent); }
    .module-card.c2::before { background: var(--accent2); }
    .module-card.c3::before { background: var(--accent3); }
    .module-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--accent); }
    .module-card .icon { font-size: 2.5rem; margin-bottom: 14px; }
    .module-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .module-card p { color: var(--muted); font-size: .875rem; line-height: 1.5; }

    /* ── Section titles ── */
    .section-title {
      font-size: 1.5rem; font-weight: 700; margin-bottom: 6px;
    }
    .section-subtitle { color: var(--muted); margin-bottom: 28px; font-size: .95rem; }

    /* ── Hangul Trainer ── */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); padding: 8px 20px; border-radius: 8px;
      cursor: pointer; font-size: .875rem; transition: all .2s;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .hangul-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px;
    }
    .hangul-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 16px; text-align: center;
      cursor: pointer; transition: all .2s; user-select: none;
    }
    .hangul-card:hover, .hangul-card.flipped {
      border-color: var(--accent); background: var(--surface2);
    }
    .hangul-char { font-size: 3rem; line-height: 1; margin-bottom: 10px; }
    .hangul-rom { font-size: .95rem; font-weight: 600; color: var(--accent); }
    .hangul-sound {
      font-size: .75rem; color: var(--muted); margin-top: 6px; line-height: 1.4;
      max-height: 0; overflow: hidden; transition: max-height .3s;
    }
    .hangul-card.flipped .hangul-sound { max-height: 60px; }

    /* ── Flashcards ── */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px; border-radius: 20px;
      cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .filter-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

    .flashcard-wrap { perspective: 1000px; }
    .flashcard {
      position: relative; width: 100%; max-width: 500px; margin: 0 auto 24px;
      height: 260px; cursor: pointer;
      transform-style: preserve-3d; transition: transform .5s ease;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 32px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .card-back { transform: rotateY(180deg); }
    .card-korean { font-size: 3.5rem; margin-bottom: 10px; }
    .card-category {
      font-size: .75rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 16px;
    }
    .card-hint { font-size: .85rem; color: var(--muted); }
    .card-rom { font-size: 1.4rem; color: var(--accent); margin-bottom: 8px; font-weight: 600; }
    .card-eng { font-size: 1.15rem; color: var(--text); }

    .card-nav {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin-bottom: 16px;
    }
    .nav-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 24px; border-radius: 8px;
      cursor: pointer; font-size: .9rem; transition: all .2s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }

    .card-counter { color: var(--muted); font-size: .875rem; }
    .card-flip-hint { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 8px; }

    /* ── Quiz ── */
    .quiz-start { text-align: center; padding: 40px 0; }
    .quiz-start p { color: var(--muted); margin-bottom: 28px; }

    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      padding: 12px 32px; border-radius: 8px; cursor: pointer;
      font-size: 1rem; font-weight: 600; transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .85; }

    .btn-secondary {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 10px 24px; border-radius: 8px; cursor: pointer;
      font-size: .9rem; transition: all .2s;
    }
    .btn-secondary:hover { border-color: var(--accent); }

    .quiz-progress { margin-bottom: 24px; }
    .progress-bar {
      height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s;
    }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: .8rem; color: var(--muted); margin-bottom: 8px;
    }

    .quiz-question {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 36px; text-align: center; margin-bottom: 24px;
    }
    .q-label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
    .q-word { font-size: 3rem; margin-bottom: 8px; }
    .q-rom { font-size: 1rem; color: var(--muted); }

    .quiz-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
    }
    .opt-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 16px; border-radius: 10px;
      cursor: pointer; font-size: .95rem; transition: all .2s; text-align: left;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface2); }
    .opt-btn.correct { background: #1a3a2a; border-color: var(--accent3); color: var(--accent3); }
    .opt-btn.wrong { background: #3a1a2a; border-color: var(--accent2); color: var(--accent2); }
    .opt-btn:disabled { cursor: not-allowed; }

    .quiz-feedback {
      text-align: center; padding: 16px; border-radius: 10px; margin-bottom: 20px;
      font-weight: 600;
    }
    .quiz-feedback.correct { background: #1a3a2a; color: var(--accent3); border: 1px solid var(--accent3); }
    .quiz-feedback.wrong { background: #3a1a2a; color: var(--accent2); border: 1px solid var(--accent2); }

    .quiz-results {
      text-align: center; padding: 40px 0;
    }
    .score-circle {
      width: 140px; height: 140px; border-radius: 50%;
      border: 6px solid var(--accent); display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin: 0 auto 28px;
    }
    .score-num { font-size: 2.5rem; font-weight: 800; color: var(--accent); }
    .score-label { font-size: .8rem; color: var(--muted); }
    .score-msg { font-size: 1.25rem; margin-bottom: 8px; }
    .score-sub { color: var(--muted); margin-bottom: 28px; }
    .result-actions { display: flex; gap: 12px; justify-content: center; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script>
/* ── Utility ── */
function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'className') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child == null) continue;
    e.append(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return e;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── App State ── */
const state = {
  view: 'home',           // home | hangul | flashcard | quiz
  hangulTab: 'consonants',
  hangulFlipped: new Set(),
  fcCategory: 'All',
  fcIndex: 0,
  fcFlipped: false,
  quizState: 'idle',      // idle | active | done
  quizItems: [],
  quizIndex: 0,
  quizScore: 0,
  quizSelected: null,
  quizCorrect: null,
};

/* ── Render ── */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.append(renderHeader(), el('main', {}, renderView()));
}

function renderHeader() {
  const navItems = [
    { id: 'home', label: '🏠 Home' },
    { id: 'hangul', label: '가 Hangul' },
    { id: 'flashcard', label: '📇 Flashcards' },
    { id: 'quiz', label: '✏️ Quiz' },
  ];
  const navBtns = navItems.map(({ id, label }) =>
    el('button', {
      className: state.view === id ? 'active' : '',
      onClick: () => { state.view = id; render(); },
    }, label)
  );
  return el('header', {},
    el('div', { className: 'logo' },
      el('span', { className: 'logo-kr' }, '한'),
      el('span', {}, 'Learn Korean')
    ),
    el('nav', {}, ...navBtns)
  );
}

function renderView() {
  if (state.view === 'home') return renderHome();
  if (state.view === 'hangul') return renderHangul();
  if (state.view === 'flashcard') return renderFlashcard();
  if (state.view === 'quiz') return renderQuiz();
}

/* ── Home ── */
function renderHome() {
  return el('div', { className: 'home' },
    el('h1', {}, '한국어 배우기'),
    el('h1', {}, 'Learn ', el('span', {}, 'Korean')),
    el('p', {}, 'Choose a module to start your journey'),
    el('div', { className: 'cards-grid' },
      el('div', { className: 'module-card c1', onClick: () => { state.view = 'hangul'; render(); } },
        el('div', { className: 'icon' }, '가'),
        el('h3', {}, 'Hangul Alphabet'),
        el('p', {}, 'Learn the 14 consonants and 10 vowels of the Korean writing system.')
      ),
      el('div', { className: 'module-card c2', onClick: () => { state.view = 'flashcard'; render(); } },
        el('div', { className: 'icon' }, '📇'),
        el('h3', {}, 'Vocabulary Flashcards'),
        el('p', {}, '40+ common words across 6 categories — greetings, food, numbers and more.')
      ),
      el('div', { className: 'module-card c3', onClick: () => { state.view = 'quiz'; render(); } },
        el('div', { className: 'icon' }, '✏️'),
        el('h3', {}, 'Quiz Mode'),
        el('p', {}, 'Test yourself with multiple-choice questions on vocabulary you\'ve studied.')
      )
    )
  );
}

/* ── Hangul ── */
function renderHangul() {
  const data = state.hangulTab === 'consonants' ? HANGUL_CONSONANTS : HANGUL_VOWELS;
  const cards = data.map((item, i) => {
    const key = state.hangulTab + i;
    const flipped = state.hangulFlipped.has(key);
    return el('div', {
      className: 'hangul-card' + (flipped ? ' flipped' : ''),
      onClick: () => {
        if (flipped) state.hangulFlipped.delete(key);
        else state.hangulFlipped.add(key);
        render();
      },
    },
      el('div', { className: 'hangul-char' }, item.char),
      el('div', { className: 'hangul-rom' }, item.romanization),
      el('div', { className: 'hangul-sound' }, item.sound)
    );
  });

  return el('div', {},
    el('div', { className: 'section-title' }, 'Hangul Alphabet'),
    el('div', { className: 'section-subtitle' }, 'Click a card to reveal the pronunciation guide'),
    el('div', { className: 'tab-bar' },
      el('button', {
        className: 'tab' + (state.hangulTab === 'consonants' ? ' active' : ''),
        onClick: () => { state.hangulTab = 'consonants'; state.hangulFlipped.clear(); render(); },
      }, 'Consonants (자음)'),
      el('button', {
        className: 'tab' + (state.hangulTab === 'vowels' ? ' active' : ''),
        onClick: () => { state.hangulTab = 'vowels'; state.hangulFlipped.clear(); render(); },
      }, 'Vowels (모음)')
    ),
    el('div', { className: 'hangul-grid' }, ...cards)
  );
}

/* ── Flashcards ── */
function getFilteredVocab() {
  if (state.fcCategory === 'All') return VOCABULARY;
  return VOCABULARY.filter(w => w.category === state.fcCategory);
}

function renderFlashcard() {
  const categories = ['All', ...new Set(VOCABULARY.map(w => w.category))];
  const words = getFilteredVocab();
  const idx = Math.min(state.fcIndex, words.length - 1);
  const word = words[idx];

  const filterBtns = categories.map(cat =>
    el('button', {
      className: 'filter-btn' + (state.fcCategory === cat ? ' active' : ''),
      onClick: () => { state.fcCategory = cat; state.fcIndex = 0; state.fcFlipped = false; render(); },
    }, cat)
  );

  const card = el('div', {
    className: 'flashcard' + (state.fcFlipped ? ' flipped' : ''),
    onClick: () => { state.fcFlipped = !state.fcFlipped; render(); },
  },
    el('div', { className: 'card-face card-front' },
      el('div', { className: 'card-category' }, word.category),
      el('div', { className: 'card-korean' }, word.korean),
      el('div', { className: 'card-hint' }, 'Click to reveal')
    ),
    el('div', { className: 'card-face card-back' },
      el('div', { className: 'card-rom' }, word.romanization),
      el('div', { className: 'card-eng' }, word.english)
    )
  );

  const prev = el('button', {
    className: 'nav-btn',
    disabled: idx === 0 ? 'disabled' : '',
    onClick: () => { state.fcIndex = idx - 1; state.fcFlipped = false; render(); },
  }, '← Prev');

  const next = el('button', {
    className: 'nav-btn',
    disabled: idx === words.length - 1 ? 'disabled' : '',
    onClick: () => { state.fcIndex = idx + 1; state.fcFlipped = false; render(); },
  }, 'Next →');

  return el('div', {},
    el('div', { className: 'section-title' }, 'Vocabulary Flashcards'),
    el('div', { className: 'section-subtitle' }, 'Click a card to flip and reveal the answer'),
    el('div', { className: 'filter-bar' }, ...filterBtns),
    el('div', { className: 'flashcard-wrap' }, card),
    el('div', { className: 'card-nav' },
      prev,
      el('span', { className: 'card-counter' }, `${idx + 1} / ${words.length}`),
      next
    ),
    el('div', { className: 'card-flip-hint' }, '← → arrow keys to navigate • Space to flip')
  );
}

/* ── Quiz ── */
function buildQuizItems() {
  const pool = shuffle(VOCABULARY).slice(0, 10);
  return pool.map(word => {
    const distractors = shuffle(
      VOCABULARY.filter(w => w.english !== word.english)
    ).slice(0, 3).map(w => w.english);
    const options = shuffle([word.english, ...distractors]);
    return { word, options, answer: word.english };
  });
}

function renderQuiz() {
  if (state.quizState === 'idle') return renderQuizStart();
  if (state.quizState === 'active') return renderQuizActive();
  if (state.quizState === 'done') return renderQuizDone();
}

function renderQuizStart() {
  return el('div', { className: 'quiz-start' },
    el('div', { className: 'section-title' }, '✏️ Quiz Mode'),
    el('p', {}, '10 multiple-choice questions drawn from the vocabulary list.\nWhat does each Korean word mean?'),
    el('button', {
      className: 'btn-primary',
      onClick: () => {
        state.quizItems = buildQuizItems();
        state.quizIndex = 0;
        state.quizScore = 0;
        state.quizSelected = null;
        state.quizCorrect = null;
        state.quizState = 'active';
        render();
      },
    }, 'Start Quiz')
  );
}

function renderQuizActive() {
  const items = state.quizItems;
  const qi = state.quizIndex;
  const item = items[qi];
  const answered = state.quizSelected !== null;

  const progressPct = (qi / items.length) * 100;

  const opts = item.options.map(opt => {
    let cls = 'opt-btn';
    if (answered) {
      if (opt === item.answer) cls += ' correct';
      else if (opt === state.quizSelected && opt !== item.answer) cls += ' wrong';
    }
    return el('button', {
      className: cls,
      disabled: answered ? 'disabled' : '',
      onClick: () => {
        if (answered) return;
        state.quizSelected = opt;
        state.quizCorrect = opt === item.answer;
        if (state.quizCorrect) state.quizScore++;
        render();
      },
    }, opt);
  });

  const feedback = answered
    ? el('div', { className: 'quiz-feedback ' + (state.quizCorrect ? 'correct' : 'wrong') },
        state.quizCorrect ? '✓ Correct!' : `✗ The answer was: ${item.answer}`
      )
    : null;

  const nextBtn = answered
    ? el('div', { style: 'text-align:center' },
        el('button', {
          className: 'btn-primary',
          onClick: () => {
            if (qi + 1 >= items.length) {
              state.quizState = 'done';
            } else {
              state.quizIndex++;
              state.quizSelected = null;
              state.quizCorrect = null;
            }
            render();
          },
        }, qi + 1 >= items.length ? 'See Results' : 'Next →')
      )
    : null;

  return el('div', {},
    el('div', { className: 'quiz-progress' },
      el('div', { className: 'progress-label' },
        el('span', {}, `Question ${qi + 1} of ${items.length}`),
        el('span', {}, `Score: ${state.quizScore}`)
      ),
      el('div', { className: 'progress-bar' },
        el('div', { className: 'progress-fill', style: `width:${progressPct}%` })
      )
    ),
    el('div', { className: 'quiz-question' },
      el('div', { className: 'q-label' }, 'What does this mean?'),
      el('div', { className: 'q-word' }, item.word.korean),
      el('div', { className: 'q-rom' }, item.word.romanization)
    ),
    el('div', { className: 'quiz-options' }, ...opts),
    feedback,
    nextBtn
  );
}

function renderQuizDone() {
  const total = state.quizItems.length;
  const score = state.quizScore;
  const pct = Math.round((score / total) * 100);
  const msg = pct === 100 ? '🎉 Perfect score!' : pct >= 70 ? '👍 Great job!' : pct >= 40 ? '📚 Keep practicing!' : '💪 Don\'t give up!';

  return el('div', { className: 'quiz-results' },
    el('div', { className: 'score-circle' },
      el('div', { className: 'score-num' }, `${score}/${total}`),
      el('div', { className: 'score-label' }, `${pct}%`)
    ),
    el('div', { className: 'score-msg' }, msg),
    el('div', { className: 'score-sub' }, `You got ${score} out of ${total} questions correct.`),
    el('div', { className: 'result-actions' },
      el('button', {
        className: 'btn-primary',
        onClick: () => {
          state.quizItems = buildQuizItems();
          state.quizIndex = 0;
          state.quizScore = 0;
          state.quizSelected = null;
          state.quizCorrect = null;
          state.quizState = 'active';
          render();
        },
      }, 'Try Again'),
      el('button', {
        className: 'btn-secondary',
        onClick: () => { state.view = 'flashcard'; render(); },
      }, 'Study Flashcards')
    )
  );
}

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown', e => {
  if (state.view === 'flashcard') {
    const words = getFilteredVocab();
    const idx = Math.min(state.fcIndex, words.length - 1);
    if (e.key === 'ArrowRight' && idx < words.length - 1) {
      state.fcIndex = idx + 1; state.fcFlipped = false; render();
    } else if (e.key === 'ArrowLeft' && idx > 0) {
      state.fcIndex = idx - 1; state.fcFlipped = false; render();
    } else if (e.key === ' ') {
      e.preventDefault();
      state.fcFlipped = !state.fcFlipped; render();
    }
  }
});

/* ── Boot ── */
render();
</script>
</body>
