<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국어 배우기 · Learn Korean</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c63ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Learn Korean" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="description" content="Learn Korean with flashcards, quizzes, dialogues, particle drills and more — works offline" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e42;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #7878a0;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,.4);
    }

    html, body { overflow-x: hidden; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: var(--surface);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
      flex-wrap: nowrap; overflow: hidden;
    }
    .logo { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; flex-shrink: 0; }
    .logo-kr { font-size: 1.5rem; }
    nav { display: flex; gap: 6px; }
    nav button {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .875rem; font-weight: 500; transition: all .2s;
    }
    nav button:hover { color: var(--text); border-color: var(--border); }
    nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    main { flex: 1; padding: 32px 24px; max-width: 920px; margin: 0 auto; width: 100%; }

    /* ── Shared ── */
    .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .section-subtitle { color: var(--muted); margin-bottom: 24px; font-size: .9rem; }

    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      padding: 11px 28px; border-radius: 8px; cursor: pointer; font-size: .95rem; font-weight: 600; transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .85; }
    .btn-secondary {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: .9rem; transition: all .2s;
    }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-danger {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .btn-danger:hover { color: var(--accent2); border-color: var(--accent2); }

    /* ── Progress bar ── */
    .prog-bar-wrap { margin-bottom: 6px; }
    .prog-bar-top { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 5px; }
    .prog-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
    .prog-fill.c1 { background: var(--accent); }
    .prog-fill.c2 { background: var(--accent2); }
    .prog-fill.c3 { background: var(--accent3); }

    /* ── Home ── */
    .home-hero { margin-bottom: 36px; }
    .home-hero h1 { font-size: 2.6rem; font-weight: 800; margin-bottom: 6px; }
    .home-hero h1 span { color: var(--accent); }
    .home-hero p { color: var(--muted); font-size: 1rem; }

    .progress-dashboard {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 32px;
    }
    .dashboard-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 18px; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px,1fr)); gap: 16px; margin-bottom: 20px; }
    .dash-stat { text-align: center; }
    .dash-num { font-size: 2rem; font-weight: 800; }
    .dash-num.c1 { color: var(--accent); }
    .dash-num.c2 { color: var(--accent2); }
    .dash-num.c3 { color: var(--accent3); }
    .dash-label { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .module-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden;
    }
    .module-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .module-card.c1::before { background: var(--accent); }
    .module-card.c2::before { background: var(--accent2); }
    .module-card.c3::before { background: var(--accent3); }
    .module-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
    .module-card .icon { font-size: 2rem; margin-bottom: 12px; }
    .module-card h3 { font-size: 1rem; margin-bottom: 4px; }
    .module-card p { color: var(--muted); font-size: .82rem; line-height: 1.5; margin-bottom: 12px; }
    .module-card .card-prog { }

    /* ── Hangul ── */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 22px; }
    .tab {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 7px 18px; border-radius: 8px; cursor: pointer; font-size: .875rem; transition: all .2s;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .hangul-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .hangul-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 14px; text-align: center; cursor: pointer; transition: all .2s; position: relative;
    }
    .hangul-card:hover { border-color: var(--accent); background: var(--surface2); }
    .hangul-card.studied { border-color: var(--accent3); }
    .studied-badge {
      position: absolute; top: 8px; right: 8px; background: var(--accent3);
      color: #000; font-size: .65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .hangul-char { font-size: 2.8rem; line-height: 1; margin-bottom: 8px; }
    .hangul-rom { font-size: .9rem; font-weight: 600; color: var(--accent); }
    .hangul-sound {
      font-size: .72rem; color: var(--muted); margin-top: 6px; line-height: 1.4;
      max-height: 0; overflow: hidden; transition: max-height .3s;
    }
    .hangul-card.flipped .hangul-sound { max-height: 60px; }
    .hangul-prog-row { margin-bottom: 20px; }

    /* ── Flashcards ── */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .filter-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

    .fc-stats { display: flex; gap: 16px; margin-bottom: 20px; }
    .fc-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: .82rem; }
    .fc-stat span { font-weight: 700; }
    .fc-stat .known { color: var(--accent3); }
    .fc-stat .learning { color: var(--accent2); }

    .flashcard-wrap { perspective: 1000px; }
    .flashcard {
      position: relative; width: 100%; max-width: 480px; margin: 0 auto 20px;
      height: 240px; cursor: pointer; transform-style: preserve-3d; transition: transform .5s ease;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 28px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .card-face.known-card { border-color: var(--accent3); }
    .card-back { transform: rotateY(180deg); }
    .card-korean { font-size: 3.2rem; margin-bottom: 8px; }
    .card-category { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
    .card-hint { font-size: .82rem; color: var(--muted); }
    .card-rom { font-size: 1.3rem; color: var(--accent); margin-bottom: 8px; font-weight: 600; }
    .card-eng { font-size: 1.1rem; color: var(--text); }
    .known-tag { position: absolute; top: 12px; right: 12px; background: var(--accent3); color: #000; font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }

    .card-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
    .nav-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: .875rem; transition: all .2s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .card-counter { color: var(--muted); font-size: .875rem; }

    .know-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
    .btn-know {
      background: #1a3a2a; color: var(--accent3); border: 1px solid var(--accent3);
      padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: .875rem; font-weight: 600; transition: all .2s;
    }
    .btn-know:hover { background: var(--accent3); color: #000; }
    .btn-unlearn {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .btn-unlearn:hover { border-color: var(--accent2); color: var(--accent2); }
    .card-flip-hint { text-align: center; color: var(--muted); font-size: .78rem; }

    /* ── Quiz ── */
    .quiz-start { text-align: center; padding: 32px 0; }
    .quiz-history {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px;
    }
    .quiz-hist-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 16px; font-size: .82rem; text-align: center; min-width: 80px;
    }
    .quiz-hist-item .h-score { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .quiz-hist-item .h-date { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .quiz-best { margin-bottom: 8px; color: var(--muted); font-size: .9rem; }
    .quiz-best span { color: var(--accent3); font-weight: 700; }

    .quiz-progress { margin-bottom: 22px; }
    .progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
    .progress-label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 7px; }

    .quiz-question {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; text-align: center; margin-bottom: 20px;
    }
    .q-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .q-word { font-size: 3rem; margin-bottom: 6px; }
    .q-rom { font-size: .95rem; color: var(--muted); }

    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .opt-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 14px; border-radius: 10px; cursor: pointer; font-size: .9rem; transition: all .2s; text-align: left;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface2); }
    .opt-btn.correct { background: #1a3a2a; border-color: var(--accent3); color: var(--accent3); }
    .opt-btn.wrong { background: #3a1a2a; border-color: var(--accent2); color: var(--accent2); }
    .opt-btn:disabled { cursor: not-allowed; }

    .quiz-feedback {
      text-align: center; padding: 14px; border-radius: 10px; margin-bottom: 18px; font-weight: 600;
    }
    .quiz-feedback.correct { background: #1a3a2a; color: var(--accent3); border: 1px solid var(--accent3); }
    .quiz-feedback.wrong { background: #3a1a2a; color: var(--accent2); border: 1px solid var(--accent2); }

    .quiz-results { text-align: center; padding: 32px 0; }
    .score-circle {
      width: 130px; height: 130px; border-radius: 50%; border: 5px solid var(--accent);
      display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 24px;
    }
    .score-num { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
    .score-label { font-size: .75rem; color: var(--muted); }
    .score-msg { font-size: 1.2rem; margin-bottom: 6px; }
    .score-sub { color: var(--muted); margin-bottom: 24px; }
    .result-actions { display: flex; gap: 10px; justify-content: center; }

    .reset-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }

    /* ── Sentences Module ── */
    .pattern-grid { display: flex; flex-direction: column; gap: 16px; }
    .pattern-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color .2s;
    }
    .pattern-card:hover { border-color: var(--accent); }
    .pattern-card.open { border-color: var(--accent); }
    .pattern-header {
      display: flex; align-items: center; gap: 12px; padding: 18px 20px;
    }
    .pattern-badge {
      font-size: .7rem; font-weight: 700; padding: 3px 10px; border-radius: 12px;
      text-transform: uppercase; letter-spacing: .06em; color: #fff; white-space: nowrap;
    }
    .pattern-title { font-size: 1rem; font-weight: 600; flex: 1; }
    .pattern-summary { font-size: .82rem; color: var(--muted); margin-left: auto; max-width: 340px; text-align: right; }
    .pattern-chevron { color: var(--muted); font-size: .8rem; transition: transform .3s; }
    .pattern-card.open .pattern-chevron { transform: rotate(180deg); }
    .pattern-body { display: none; padding: 0 20px 20px; }
    .pattern-card.open .pattern-body { display: block; }
    .pattern-explanation {
      font-size: .875rem; color: var(--muted); line-height: 1.7;
      padding: 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 16px;
    }
    .examples-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
    .example-row {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .ex-korean { font-size: 1.5rem; margin-bottom: 4px; }
    .ex-rom { font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
    .ex-english { font-size: .9rem; color: var(--text); margin-bottom: 10px; }
    .ex-parts { display: flex; flex-wrap: wrap; gap: 6px; }
    .ex-part {
      font-size: .75rem; padding: 3px 10px; border-radius: 12px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    }
    .ex-part span { color: var(--text); font-weight: 600; }

    /* Builder */
    .builder-wrap { }
    .builder-question {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; text-align: center; margin-bottom: 20px;
    }
    .bq-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .bq-english { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; }
    .bq-pattern { font-size: .78rem; color: var(--accent); }
    .builder-answer {
      min-height: 64px; background: var(--surface2); border: 2px dashed var(--border);
      border-radius: var(--radius); padding: 12px 16px; display: flex;
      flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px;
      transition: border-color .2s;
    }
    .builder-answer.has-words { border-color: var(--accent); border-style: solid; }
    .builder-placeholder { color: var(--muted); font-size: .875rem; margin: auto; }
    .word-tile {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 1rem;
      transition: all .15s; user-select: none;
    }
    .word-tile:hover { border-color: var(--accent); background: var(--surface2); }
    .word-tile.in-answer { background: var(--accent); border-color: var(--accent); color: #fff; }
    .word-tile.in-answer:hover { opacity: .85; }
    .word-tile.disabled { opacity: .3; cursor: not-allowed; }
    .builder-tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .builder-actions { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .builder-feedback {
      padding: 14px 18px; border-radius: 10px; font-weight: 600; font-size: .95rem;
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
    }
    .builder-feedback.correct { background: #1a3a2a; color: var(--accent3); border: 1px solid var(--accent3); }
    .builder-feedback.wrong { background: #3a1a2a; color: var(--accent2); border: 1px solid var(--accent2); }
    .builder-correct-ans { font-size: .85rem; opacity: .85; }
    .builder-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .builder-dots { display: flex; gap: 5px; }
    .bdot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
    .bdot.done { background: var(--accent3); }
    .bdot.current { background: var(--accent); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Level selector ── */
    .level-selector { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 30px; }
    .level-btn {
      padding: 18px 10px; border-radius: var(--radius); border: 2px solid var(--border);
      background: var(--surface); color: var(--muted); cursor: pointer; text-align: center;
      transition: all .25s; font-size: .85rem; font-weight: 600;
    }
    .level-btn:hover { border-color: var(--accent); color: var(--text); transform: translateY(-2px); box-shadow: var(--shadow); }
    .level-btn.active.beginner     { border-color: #43e97b; background: rgba(67,233,123,.07);  color: #43e97b; }
    .level-btn.active.intermediate { border-color: #ffa94d; background: rgba(255,169,77,.07);  color: #ffa94d; }
    .level-btn.active.expert       { border-color: var(--accent2); background: rgba(255,101,132,.07); color: var(--accent2); }
    .level-emoji { font-size: 1.9rem; margin-bottom: 7px; }
    .level-btn-label { font-size: .95rem; font-weight: 700; }
    .level-btn-sub { font-size: .72rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .level-btn.active .level-btn-sub { color: inherit; opacity: .75; }
    .level-section-title {
      font-size: .75rem; text-transform: uppercase; letter-spacing: .09em;
      color: var(--muted); margin-bottom: 10px;
    }
    .level-badge {
      font-size: .7rem; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      letter-spacing: .05em; white-space: nowrap; margin-left: 10px; vertical-align: middle;
    }
    .level-badge.beginner     { background: rgba(67,233,123,.15);  color: #43e97b;         border: 1px solid rgba(67,233,123,.5); }
    .level-badge.intermediate { background: rgba(255,169,77,.15);  color: #ffa94d;         border: 1px solid rgba(255,169,77,.5); }
    .level-badge.expert       { background: rgba(255,101,132,.15); color: var(--accent2);  border: 1px solid rgba(255,101,132,.5); }
    .level-filter-note { font-size: .78rem; color: var(--muted); margin-bottom: 16px; padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }

    /* ── Audio / Speech ── */
    .speak-btn {
      background: none; border: 1px solid transparent; cursor: pointer;
      font-size: .95rem; padding: 3px 7px; border-radius: 6px;
      color: var(--muted); transition: all .15s; line-height: 1; vertical-align: middle;
    }
    .speak-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(108,99,255,.1); }
    .speak-btn-lg {
      background: var(--surface2); border: 1px solid var(--border); cursor: pointer;
      font-size: .875rem; padding: 7px 16px; border-radius: 8px;
      color: var(--text); transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .speak-btn-lg:hover { border-color: var(--accent); color: var(--accent); }
    .stop-btn {
      background: rgba(255,101,132,.08); border: 1px solid var(--accent2); cursor: pointer;
      font-size: .875rem; padding: 7px 16px; border-radius: 8px;
      color: var(--accent2); transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .stop-btn:hover { background: rgba(255,101,132,.18); }
    .audio-bar {
      display: flex; gap: 8px; align-items: center; justify-content: center;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .story-line-kr { position: relative; }
    .line-speak { float: right; margin-top: 2px; }

    /* ── Reading Module ── */
    .reading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 16px; }
    .story-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 22px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden;
    }
    .story-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
    .story-card.beginner::before     { background: #43e97b; }
    .story-card.intermediate::before { background: #ffa94d; }
    .story-card.expert::before       { background: var(--accent2); }
    .story-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
    .story-card-emoji { font-size: 2.2rem; margin-bottom: 10px; }
    .story-card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 2px; }
    .story-card-title-eng { font-size: .82rem; color: var(--muted); margin-bottom: 8px; }
    .story-card-desc { font-size: .8rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
    .story-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .story-card-lines { font-size: .73rem; color: var(--muted); }
    .story-read-badge  { font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(67,233,123,.15); color:#43e97b; border:1px solid rgba(67,233,123,.4); }
    .story-score-badge { font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(108,99,255,.15); color:var(--accent); border:1px solid rgba(108,99,255,.4); }

    /* Story reader */
    .story-reader-header {
      display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .story-reader-toggles { display: flex; gap: 8px; margin-left: auto; }
    .toggle-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .toggle-btn.on { background: rgba(108,99,255,.15); border-color: var(--accent); color: var(--accent); }
    .story-body {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 28px 32px; margin-bottom: 22px;
    }
    .story-line { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .story-line:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .story-line-kr  { font-size: 1.55rem; line-height: 1.6; margin-bottom: 4px; }
    .story-line-rom { font-size: .85rem; color: var(--muted); font-style: italic; margin-bottom: 3px; }
    .story-line-eng { font-size: .9rem; color: var(--accent3); margin-top: 4px; }

    /* Vocabulary section */
    .vocab-section { margin-bottom: 22px; }
    .vocab-section-title { font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:12px; }
    .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 8px; }
    .vocab-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .vocab-chip-kr  { font-size: 1.1rem; margin-bottom: 3px; }
    .vocab-chip-rom { font-size: .72rem; color: var(--accent); margin-bottom: 2px; }
    .vocab-chip-eng { font-size: .75rem; color: var(--muted); }

    /* ── Streak / XP Widget ── */
    .streak-widget {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 22px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .streak-fire { font-size: 2.2rem; line-height: 1; }
    .streak-info { flex: 1; min-width: 140px; }
    .streak-num { font-size: 1.6rem; font-weight: 800; color: #ffa94d; line-height: 1; }
    .streak-label { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .xp-section { flex: 2; min-width: 180px; }
    .xp-top { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 5px; }
    .xp-bar-wrap { height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #ffa94d, #ff6584); border-radius: 5px; transition: width .5s ease; }
    .xp-earned { font-size: .72rem; color: var(--muted); margin-top: 4px; }
    .xp-badge { font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: rgba(255,169,77,.18); color: #ffa94d; border: 1px solid rgba(255,169,77,.4); margin-left: 8px; vertical-align: middle; }
    .streak-badge { font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: rgba(255,101,132,.15); color: var(--accent2); border: 1px solid rgba(255,101,132,.4); margin-left: 6px; vertical-align: middle; }
    .goal-done { font-size: .72rem; color: var(--accent3); font-weight: 600; }

    /* ── SRS Buttons ── */
    .srs-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
    .srs-btn {
      padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: .82rem; font-weight: 600; border: 1px solid transparent; transition: all .2s;
    }
    .srs-again { background: #3a1a1a; color: #ff6b6b; border-color: #ff6b6b; }
    .srs-again:hover { background: #ff6b6b; color: #fff; }
    .srs-good  { background: #1a2a3a; color: #74b9ff; border-color: #74b9ff; }
    .srs-good:hover  { background: #74b9ff; color: #000; }
    .srs-easy  { background: #1a3a2a; color: var(--accent3); border-color: var(--accent3); }
    .srs-easy:hover  { background: var(--accent3); color: #000; }
    .srs-label { font-size: .65rem; display: block; opacity: .75; font-weight: 400; margin-top: 2px; }
    .due-badge { display: inline-block; background: rgba(255,101,132,.15); color: var(--accent2); border: 1px solid rgba(255,101,132,.4); font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }

    /* ── Dialogue Practice ── */
    .dialogue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 16px; }
    .dialogue-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden;
    }
    .dialogue-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
    .dialogue-card.beginner::before     { background: #43e97b; }
    .dialogue-card.intermediate::before { background: #ffa94d; }
    .dialogue-card.expert::before       { background: var(--accent2); }
    .dialogue-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
    .dialogue-card-emoji { font-size: 2rem; margin-bottom: 8px; }
    .dialogue-card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
    .dialogue-card-title-eng { font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
    .dialogue-card-desc { font-size: .78rem; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
    .dialogue-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .dialogue-done-badge { font-size:.65rem; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(67,233,123,.15); color:#43e97b; border:1px solid rgba(67,233,123,.4); }
    .dialogue-score-badge { font-size:.65rem; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(108,99,255,.15); color:var(--accent); border:1px solid rgba(108,99,255,.4); }

    /* Chat bubble UI */
    .chat-container { display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px; }
    .chat-bubble-wrap { display: flex; align-items: flex-end; gap: 8px; }
    .chat-bubble-wrap.speaker-b { flex-direction: row-reverse; }
    .chat-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .chat-avatar.a { background: rgba(108,99,255,.25); border: 1px solid rgba(108,99,255,.5); }
    .chat-avatar.b { background: rgba(255,101,132,.25); border: 1px solid rgba(255,101,132,.5); }
    .chat-bubble {
      max-width: 70%; padding: 12px 16px; border-radius: 16px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .chat-bubble-wrap.speaker-a .chat-bubble { border-bottom-left-radius: 4px; }
    .chat-bubble-wrap.speaker-b .chat-bubble { border-bottom-right-radius: 4px; background: rgba(108,99,255,.1); border-color: rgba(108,99,255,.3); }
    .chat-kr { font-size: 1.15rem; line-height: 1.5; margin-bottom: 3px; }
    .chat-rom { font-size: .75rem; color: var(--muted); font-style: italic; }
    .chat-eng { font-size: .8rem; color: var(--accent3); margin-top: 4px; }
    .chat-line-actions { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .dialogue-reader-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .dialogue-reader-toggles { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .chat-speaker-label { font-size: .68rem; color: var(--muted); margin-bottom: 4px; }
    .chat-bubble-wrap.speaker-b .chat-speaker-label { text-align: right; }
    .chat-line-col { display: flex; flex-direction: column; }

    /* ── Particle Drills ── */
    .drill-wrap { max-width: 600px; margin: 0 auto; }
    .drill-sentence-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px 28px; text-align: center; margin-bottom: 22px;
    }
    .drill-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 12px; }
    .drill-sentence { font-size: 1.8rem; line-height: 1.6; margin-bottom: 10px; }
    .drill-blank { display: inline-block; min-width: 56px; border-bottom: 3px solid var(--accent2); color: var(--accent2); font-weight: 800; padding: 0 6px; }
    .drill-blank.answered { border-color: var(--accent3); color: var(--accent3); }
    .drill-blank.wrong-ans { border-color: var(--accent2); }
    .drill-hint { font-size: .78rem; color: var(--muted); margin-top: 8px; }
    .drill-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .drill-opt {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 16px; border-radius: 10px; cursor: pointer; font-size: 1.4rem;
      font-weight: 700; text-align: center; transition: all .2s;
    }
    .drill-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--surface2); transform: translateY(-1px); }
    .drill-opt.correct { background: #1a3a2a; border-color: var(--accent3); color: var(--accent3); }
    .drill-opt.wrong   { background: #3a1a2a; border-color: var(--accent2); color: var(--accent2); }
    .drill-opt:disabled { cursor: not-allowed; }
    .drill-explanation {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 18px; font-size: .875rem; line-height: 1.6; margin-bottom: 18px; color: var(--muted);
    }
    .drill-explanation strong { color: var(--text); }
    .drill-progress-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .drill-score-badge { font-size: .8rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; background: rgba(108,99,255,.15); color: var(--accent); border: 1px solid rgba(108,99,255,.4); }

    /* ── Phrasebook ── */
    .phrase-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .phrase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
    .phrase-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; transition: border-color .2s;
    }
    .phrase-card:hover { border-color: var(--accent); }
    .phrase-kr { font-size: 1.35rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .phrase-rom { font-size: .8rem; color: var(--accent); margin-bottom: 3px; font-style: italic; }
    .phrase-eng { font-size: .875rem; color: var(--text); margin-bottom: 6px; }
    .phrase-tip { font-size: .72rem; color: var(--muted); padding: 5px 10px; background: var(--surface2); border-radius: 6px; line-height: 1.5; }
    .phrase-cat-tag { font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); display: inline-block; margin-bottom: 8px; }

    /* ── K-Pop / Drama Phrases ── */
    .kpop-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .kpop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 14px; }
    .kpop-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; transition: all .25s; position: relative; overflow: hidden;
    }
    .kpop-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .kpop-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
    .kpop-emoji { font-size: 1.6rem; margin-bottom: 8px; }
    .kpop-kr { font-size: 1.5rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .kpop-rom { font-size: .8rem; color: var(--accent); font-style: italic; margin-bottom: 4px; }
    .kpop-eng { font-size: .9rem; font-weight: 600; margin-bottom: 8px; }
    .kpop-context { font-size: .75rem; color: var(--muted); line-height: 1.5; padding: 6px 10px; background: var(--surface2); border-radius: 6px; }
    .kpop-cat-badge { font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-bottom: 10px; display: inline-block; }
    .kpop-cat-badge.songs   { background: rgba(108,99,255,.15); color: var(--accent); border: 1px solid rgba(108,99,255,.4); }
    .kpop-cat-badge.dramas  { background: rgba(255,101,132,.15); color: var(--accent2); border: 1px solid rgba(255,101,132,.4); }
    .kpop-cat-badge.fandom  { background: rgba(67,233,123,.15); color: #43e97b; border: 1px solid rgba(67,233,123,.4); }
    .kpop-cat-badge.slang   { background: rgba(255,169,77,.15); color: #ffa94d; border: 1px solid rgba(255,169,77,.4); }

    /* ── Conjugation Tables ── */
    .conj-verb-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .conj-verb-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: .875rem; transition: all .2s;
    }
    .conj-verb-btn:hover { border-color: var(--accent); color: var(--text); }
    .conj-verb-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .conj-header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 20px; }
    .conj-base { font-size: 2rem; font-weight: 800; margin-bottom: 4px; }
    .conj-base-eng { font-size: .875rem; color: var(--muted); }
    .conj-irreg-note { font-size: .72rem; color: #ffa94d; background: rgba(255,169,77,.1); border: 1px solid rgba(255,169,77,.3); padding: 3px 10px; border-radius: 6px; display: inline-block; margin-top: 6px; }
    .conj-table-wrap { overflow-x: auto; margin-bottom: 20px; }
    table.conj-table { width: 100%; border-collapse: collapse; }
    table.conj-table th {
      background: var(--surface2); color: var(--muted); font-size: .72rem;
      text-transform: uppercase; letter-spacing: .07em; padding: 10px 14px;
      border: 1px solid var(--border); text-align: center; font-weight: 600;
    }
    table.conj-table td {
      background: var(--surface); border: 1px solid var(--border);
      padding: 12px 14px; vertical-align: middle;
    }
    table.conj-table tr:hover td { background: var(--surface2); }
    .conj-row-label { font-size: .78rem; color: var(--muted); font-weight: 600; min-width: 100px; }
    .conj-cell { display: flex; align-items: center; gap: 8px; }
    .conj-kr { font-size: 1.15rem; font-weight: 600; }
    .conj-rom { font-size: .72rem; color: var(--accent); display: block; margin-top: 2px; }
    .conj-col-formal   .conj-kr { color: var(--accent); }
    .conj-col-polite   .conj-kr { color: var(--accent3); }
    .conj-col-informal .conj-kr { color: var(--accent2); }

    /* ── Mobile Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* Compact header — hide desktop nav, show only logo + badges */
      header {
        padding: 10px 16px;
      }
      header nav { display: none !important; }
      .logo { font-size: 1rem; }
      .logo-kr { font-size: 1.3rem; }
      .level-badge { font-size: .7rem; padding: 3px 7px; }
      .streak-badge, .xp-badge { font-size: .75rem; padding: 3px 8px; }

      /* Main content — leave room for bottom nav */
      main { padding: 20px 14px 90px !important; max-width: 100% !important; }

      /* Home hero smaller on mobile */
      .home-hero h1 { font-size: 1.6rem !important; word-break: break-word; }
      .dashboard-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .cards-grid { grid-template-columns: 1fr !important; }

      /* Flashcard adjustments */
      .flashcard { height: 200px; }
      .card-korean { font-size: 2.4rem; }
      .fc-stats { flex-direction: column; gap: 8px; }

      /* Quiz options full width */
      .quiz-options { grid-template-columns: 1fr !important; }

      /* Sentence builder */
      .builder-dots { flex-wrap: wrap; }

      /* Hangul grid tighter */
      .hangul-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }

      /* Dialogue bubbles */
      .bubble { max-width: 90%; }

      /* Conjugation table scroll */
      .conj-wrap, table { overflow-x: auto; display: block; }

      /* Prevent any element from causing horizontal scroll */
      * { max-width: 100%; }
      img, video { height: auto; }
    }

    /* ── Bottom Navigation Bar (mobile only) ───────────────────────────────── */
    .bottom-nav {
      display: none;
    }
    @media (max-width: 768px) {
      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: var(--surface);
        border-top: 1px solid var(--border);
        z-index: 200;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .bottom-nav::-webkit-scrollbar { display: none; }
      .bottom-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-width: 60px;
        padding: 8px 4px 6px;
        cursor: pointer;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: .62rem;
        font-weight: 500;
        gap: 3px;
        transition: color .2s;
        -webkit-tap-highlight-color: transparent;
      }
      .bottom-nav-item .bn-icon { font-size: 1.3rem; line-height: 1; }
      .bottom-nav-item.active { color: var(--accent); }
      .bottom-nav-item.active .bn-icon { transform: scale(1.1); }
    }
  </style>

<div id="app"></div>
<script>
const HANGUL_CONSONANTS = [
  { char: "ㄱ", romanization: "g/k", sound: "like 'g' in go" },
  { char: "ㄴ", romanization: "n",   sound: "like 'n' in no" },
  { char: "ㄷ", romanization: "d/t", sound: "like 'd' in do" },
  { char: "ㄹ", romanization: "r/l", sound: "between 'r' and 'l'" },
  { char: "ㅁ", romanization: "m",   sound: "like 'm' in me" },
  { char: "ㅂ", romanization: "b/p", sound: "like 'b' in boy" },
  { char: "ㅅ", romanization: "s",   sound: "like 's' in sun" },
  { char: "ㅇ", romanization: "ng/silent", sound: "silent at start, 'ng' at end" },
  { char: "ㅈ", romanization: "j",   sound: "like 'j' in joy" },
  { char: "ㅊ", romanization: "ch",  sound: "like 'ch' in chair" },
  { char: "ㅋ", romanization: "k",   sound: "aspirated 'k'" },
  { char: "ㅌ", romanization: "t",   sound: "aspirated 't'" },
  { char: "ㅍ", romanization: "p",   sound: "aspirated 'p'" },
  { char: "ㅎ", romanization: "h",   sound: "like 'h' in hat" },
];

const HANGUL_VOWELS = [
  { char: "ㅏ", romanization: "a",   sound: "like 'a' in father" },
  { char: "ㅑ", romanization: "ya",  sound: "like 'ya' in yard" },
  { char: "ㅓ", romanization: "eo",  sound: "like 'u' in fun" },
  { char: "ㅕ", romanization: "yeo", sound: "like 'yuh'" },
  { char: "ㅗ", romanization: "o",   sound: "like 'o' in old" },
  { char: "ㅛ", romanization: "yo",  sound: "like 'yo' in yoga" },

<script>
/* ── Utilities ── */
function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'className') e.className = v;
    else if (k === 'style' && typeof v === 'string') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    e.append(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── Speech synthesis ── */
const TTS = {
  // Speak a single Korean text
  speak(text, rate = 0.82) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'ko-KR';
    utt.rate = rate;
    utt.pitch = 1.0;
    window.speechSynthesis.speak(utt);
  },
  // Queue multiple texts to be read one after another
  speakAll(texts, rate = 0.80) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    texts.forEach(text => {
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang  = 'ko-KR';
      utt.rate  = rate;
      utt.pitch = 1.0;
      window.speechSynthesis.speak(utt);
    });
  },
  stop() { if (window.speechSynthesis) window.speechSynthesis.cancel(); },
  supported() { return !!window.speechSynthesis; },
};

// Helper: inline 🔊 button that speaks Korean text
function mkSpeak(text, extraStyle = '') {
  if (!TTS.supported() || !text || text === '—') return null;
  return el('button', {
    className: 'speak-btn',
    title: 'Listen',
    style: extraStyle,
    onClick: (e) => { e.stopPropagation(); TTS.speak(text); },
  }, '🔊');
}

/* ── Persistence ── */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
};

// hangul_studied: array of char strings
// vocab_known: array of korean word strings
// quiz_history: array of { score, total, date }

function getStudied() { return new Set(store.get('hangul_studied', [])); }
function setStudied(s) { store.set('hangul_studied', [...s]); }

function getKnown() { return new Set(store.get('vocab_known', [])); }
function setKnown(s) { store.set('vocab_known', [...s]); }

function getQuizHistory(type) { return store.get(`quiz_history_${type}`, []); }
function addQuizResult(type, score, total) {
  const h = getQuizHistory(type);
  h.unshift({ score, total, date: new Date().toLocaleDateString() });
  store.set(`quiz_history_${type}`, h.slice(0, 5));
}

function resetAll() {
  localStorage.removeItem('hangul_studied');
  localStorage.removeItem('vocab_known');
  localStorage.removeItem('quiz_history');
  localStorage.removeItem('reading_completed');
  localStorage.removeItem('xp_data');
  localStorage.removeItem('srs_data');
  localStorage.removeItem('dialogue_completed');
  READING_STORIES.forEach(s => localStorage.removeItem(`reading_score_${s.id}`));
  DIALOGUES.forEach(d => localStorage.removeItem(`dialogue_score_${d.id}`));
}

function getReadingCompleted() { return store.get('reading_completed', []); }
function addReadingCompleted(id) {
  const c = getReadingCompleted();
  if (!c.includes(id)) { c.push(id); store.set('reading_completed', c); }
}
function getReadingScore(id) { return store.get(`reading_score_${id}`, null); }
function setReadingScore(id, score, total) {
  const pct = Math.round((score / total) * 100);
  const existing = getReadingScore(id);
  if (existing === null || pct > existing) store.set(`reading_score_${id}`, pct);
}

/* ── XP & Streak ── */
const DAILY_XP_GOAL = 20;
function getTodayStr() { return new Date().toISOString().slice(0, 10); }
function getXPData() { return store.get('xp_data', { today: '', xp: 0, streak: 0, lastStreakDate: '' }); }
function addXP(amount) {
  const d = getXPData();
  const today = getTodayStr();
  if (d.today !== today) { d.today = today; d.xp = 0; }
  const wasGoalMet = d.xp >= DAILY_XP_GOAL;
  d.xp += amount;
  const isGoalMet = d.xp >= DAILY_XP_GOAL;
  if (isGoalMet && !wasGoalMet) {
    // just crossed goal today — update streak
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (d.lastStreakDate === yesterday) { d.streak += 1; }
    else if (d.lastStreakDate !== today) { d.streak = 1; }
    d.lastStreakDate = today;
  }
  store.set('xp_data', d);
}
function getStreak() {
  const d = getXPData();
  const today = getTodayStr();
  // if streak day was more than 1 day ago and today's goal not met, streak is broken
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (d.lastStreakDate !== today && d.lastStreakDate !== yesterday) {
    if (d.streak > 0) { d.streak = 0; store.set('xp_data', d); }
  }
  return d.streak;
}
function getTodayXP() {
  const d = getXPData();
  return d.today === getTodayStr() ? d.xp : 0;
}

/* ── SRS ── */
function getSRSData() { return store.get('srs_data', {}); }
function rateSRSCard(wordKr, rating) {
  // rating: 'again' | 'good' | 'easy'
  const data = getSRSData();
  const now = Date.now();
  const card = data[wordKr] || { interval: 1, due: now, reps: 0 };
  card.reps += 1;
  const msDay = 86400000;
  if (rating === 'again') { card.interval = 1; }
  else if (rating === 'good') { card.interval = Math.max(2, Math.round(card.interval * 2)); }
  else { card.interval = Math.max(4, Math.round(card.interval * 3)); }
  card.due = now + card.interval * msDay;
  card.lastRated = now;
  data[wordKr] = card;
  store.set('srs_data', data);
  addXP(1);
}
function getDueCards() {
  const data = getSRSData();
  const now = Date.now();
  return VOCABULARY.filter(w => {
    const c = data[w.korean];
    return c && c.due <= now;
  });
}
function getSRSCard(wordKr) {
  return getSRSData()[wordKr] || null;
}
function getDueCount() { return getDueCards().length; }

/* ── Dialogue progress ── */
function getDialogueCompleted() { return store.get('dialogue_completed', []); }
function addDialogueCompleted(id) {
  const c = getDialogueCompleted();
  if (!c.includes(id)) { c.push(id); store.set('dialogue_completed', c); }
}
function getDialogueScore(id) { return store.get(`dialogue_score_${id}`, null); }
function setDialogueScore(id, score, total) {
  const pct = Math.round((score / total) * 100);
  const existing = getDialogueScore(id);
  if (existing === null || pct > existing) store.set(`dialogue_score_${id}`, pct);
}

  const byLevel = VOCABULARY.filter(w => levelIncluded(w.level));

  return state.fcCategory === 'All' ? byLevel : byLevel.filter(w => w.category === state.fcCategory);
}

function renderFlashcard() {
  const levelMeta2 = { beginner:'🌱 Beginner', intermediate:'📖 Intermediate', expert:'🎓 Expert' };

  // Only show categories that have at least one word at the current level
  const levelWords = VOCABULARY.filter(w => levelIncluded(w.level));
  const availableCats = new Set(levelWords.map(w => w.category));
  const dueCount = getDueCount();
  const categories = [
    ...(dueCount > 0 ? ['📋 Due'] : []),
    'All',
    ...new Set(VOCABULARY.map(w => w.category))
  ].filter(cat => cat === 'All' || cat === '📋 Due' || availableCats.has(cat));

  // If the previously-selected category is now empty at this level, reset to All
  if (state.fcCategory !== 'All' && state.fcCategory !== '📋 Due' && !availableCats.has(state.fcCategory)) {
    state.fcCategory = 'All';
    state.fcIndex = 0;
    state.fcFlipped = false;
  }
  // If Due tab selected but no due cards now
  if (state.fcCategory === '📋 Due' && dueCount === 0) {
    state.fcCategory = 'All';
    state.fcIndex = 0;
    state.fcFlipped = false;
  }

  const words = getFilteredVocab();
  const known = getKnown();
  const knownInFilter = words.filter(w => known.has(w.korean)).length;

  const header = el('div', {},
    el('div', { className: 'section-title' },
      'Vocabulary Flashcards',
      dueCount > 0 ? el('span', { className: 'due-badge' }, `${dueCount} due for review`) : null
    ),
    el('div', { className: 'section-subtitle' }, 'Flip to reveal • Rate cards for spaced repetition • Mark words you know'),
    el('div', { className: 'level-filter-note' },
      `Showing ${levelMeta2[state.level]} level words (${words.length} words). Change level on the Home screen.`
    ),
    el('div', { className: 'fc-stats' },
      el('div', { className: 'fc-stat' }, el('span', { className: 'known' }, `${knownInFilter}`), ` / ${words.length} known in this view`),
      el('div', { className: 'fc-stat' }, el('span', { className: 'known' }, `${known.size}`), ` / ${VOCABULARY.length} total known`)
    ),
    el('div', { className: 'filter-bar' },
      ...categories.map(cat =>
        el('button', {
          className: 'filter-btn' + (state.fcCategory === cat ? ' active' : ''),
          onClick: () => { state.fcCategory = cat; state.fcIndex = 0; state.fcFlipped = false; render(); },
        }, cat)
      )
    )
  );

  // Empty state — no words in this category at the current level
  if (words.length === 0) {
    return el('div', {},
      header,
      el('div', { style: 'text-align:center;padding:48px 24px;color:var(--muted)' },

// ── Shared quiz engine ─────────────────────────────────────────────────────
function renderQuizEngine({ items, index, score, selected, correct, total,
  onAnswer, onNext, onRestart, onBack, type }) {

  if (index >= total) {  // done screen
    const pct = Math.round((score / total) * 100);
    const msg = pct === 100 ? '🎉 Perfect!' : pct >= 80 ? '🌟 Excellent!' : pct >= 60 ? '👍 Great job!' : pct >= 40 ? '📚 Keep studying!' : '💪 Don\'t give up!';
    const history = getQuizHistory(type);
    return el('div', { className: 'quiz-results' },
      el('div', { className: 'score-circle' },
        el('div', { className: 'score-num' }, `${score}/${total}`),
        el('div', { className: 'score-label' }, `${pct}%`)
      ),
      el('div', { className: 'score-msg' }, msg),
      el('div', { className: 'score-sub' }, `You got ${score} out of ${total} correct.`),
      history.length > 1 ? el('div', { style: 'margin-bottom:20px' },
        el('div', { style: 'font-size:.78rem;color:var(--muted);margin-bottom:8px' }, 'Your history:'),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center' },
          ...history.map(h =>
            el('div', { className: 'quiz-hist-item' },
              el('div', { className: 'h-score' }, `${h.score}/${h.total}`),
              el('div', { className: 'h-date' }, h.date)
            )
          )
        )
      ) : null,
      el('div', { className: 'result-actions' },
        el('button', { className: 'btn-primary', onClick: onRestart }, 'Try Again'),
        el('button', { className: 'btn-secondary', onClick: onBack }, '← Quiz Menu')
      )
    );
  }

  const item = items[index];
  const answered = selected !== null;
  const pct = (index / total) * 100;

  const opts = item.options.map(opt => {
    let cls = 'opt-btn';
    if (answered) {
      if (opt === item.answer) cls += ' correct';
      else if (opt === selected && opt !== item.answer) cls += ' wrong';
    }
    return el('button', {
      className: cls, disabled: answered,
      onClick: () => onAnswer(opt),
    }, opt);
  });

  return el('div', {},
    el('div', { style: 'display:flex;align-items:center;gap:10px;margin-bottom:16px' },
      el('button', { className: 'btn-danger', onClick: onBack }, '← Back'),
      el('div', { style: 'flex:1' },
        el('div', { className: 'progress-label' },
          el('span', {}, `Question ${index + 1} / ${total}`),
          el('span', {}, `Score: ${score}`)
        ),
        el('div', { className: 'progress-bar' },
          el('div', { className: 'progress-fill', style: `width:${pct}%` })
        )
      )
    ),
    el('div', { className: 'quiz-question' },
      item.label ? el('div', { className: 'q-label' }, item.label) : null,
      el('div', { className: 'q-word' }, item.prompt),
      // Show speak button only when prompt contains Korean characters
      /[가-힣ᄀ-ᇿ㄰-㆏]/.test(item.prompt)
        ? mkSpeak(item.prompt, 'font-size:1.1rem;margin:4px 0') : null,
      item.sub ? el('div', { className: 'q-rom' }, item.sub) : null
    ),
    el('div', { className: 'quiz-options' }, ...opts),
    answered ? el('div', { className: `quiz-feedback ${correct ? 'correct' : 'wrong'}` },
      correct ? '✓ Correct!' : `✗ Answer: ${item.answer}`,
      item.tip && !correct ? el('div', { style: 'font-size:.82rem;font-weight:400;margin-top:6px;opacity:.9' }, item.tip) : null
    ) : null,
    answered ? el('div', { style: 'text-align:center' },
      el('button', { className: 'btn-primary', onClick: onNext },
        index + 1 >= total ? 'See Results' : 'Next →')
    ) : null
  );
}

// ── Vocabulary Quiz ────────────────────────────────────────────────────────
function buildVocabItems() {
  const eligible = VOCABULARY.filter(w => levelIncluded(w.level));
  const pool = shuffle(eligible).slice(0, Math.min(10, eligible.length));
  return pool.map((word, i) => {
    const k2e = i % 2 === 0; // alternate Korean→English and English→Korean
    if (k2e) {
      const distractors = shuffle(VOCABULARY.filter(w => w.english !== word.english)).slice(0, 3).map(w => w.english);
      return {
        label: 'What does this mean?',
        prompt: word.korean,
        sub: word.romanization,
        options: shuffle([word.english, ...distractors]),
        answer: word.english,
        tip: null,
      };
    } else {
      const distractors = shuffle(VOCABULARY.filter(w => w.korean !== word.korean)).slice(0, 3).map(w => `${w.korean} (${w.romanization})`);
      const answerText = `${word.korean} (${word.romanization})`;
      return {
        label: 'How do you say this in Korean?',
        prompt: word.english,
        sub: `Category: ${word.category}`,
        options: shuffle([answerText, ...distractors]),
        answer: answerText,
        tip: null,
      };
    }
  });
}

function renderVocabQuiz() {
  if (state.vqState === 'idle') {

          el('button', { className: 'btn-secondary', onClick: () => { state.quizView = 'select'; render(); } }, '← Back')
        )
      );
    }
    const h = getQuizHistory('vocab');
    const best = h.length ? Math.max(...h.map(x => Math.round((x.score/x.total)*100))) : null;
    return el('div', { className: 'quiz-start' },
      el('div', { className: 'section-title' }, '📇 Vocabulary Quiz'),
      el('p', { style: 'color:var(--muted);margin-bottom:16px' },

        el('div', { style: 'font-size:.78rem;color:var(--muted);margin-bottom:8px' }, 'Recent:'),
        el('div', { className: 'quiz-history' },
          ...h.map(x => el('div', { className: 'quiz-hist-item' },
            el('div', { className: 'h-score' }, `${x.score}/${x.total}`),
            el('div', { className: 'h-date' }, x.date)
          ))
        )
      ) : null,
      el('div', { style: 'display:flex;gap:10px;justify-content:center' },
        el('button', { className: 'btn-secondary', onClick: () => { state.quizView = 'select'; render(); } }, '← Back'),

          state.vqItems = buildVocabItems();

    onNext: () => {

/* ── Sentences ── */
function renderSentences() {
  return el('div', {},

function renderPatterns() {
  const cards = SENTENCE_PATTERNS.filter(p => levelIncluded(p.level)).map(p => {
    const isOpen = state.openPatterns.has(p.id);
    const examples = p.examples.map(ex =>
      el('div', { className: 'example-row' },
        el('div', { style: 'display:flex;align-items:center;gap:8px' },
          el('div', { className: 'ex-korean', style: 'flex:1' }, ex.korean),
          mkSpeak(ex.korean)
        ),
        el('div', { className: 'ex-rom' }, ex.romanization),
        el('div', { className: 'ex-english' }, ex.english),
        el('div', { className: 'ex-parts' },
          ...ex.parts.map(part => {
            const [kr, en] = part.split('·');
            return el('div', { className: 'ex-part' },
              el('span', {}, kr), en ? ` — ${en}` : ''
            );
          })
        )
      )
    );

    return el('div', {
      className: 'pattern-card' + (isOpen ? ' open' : ''),
      onClick: () => {
        if (isOpen) state.openPatterns.delete(p.id);
        else state.openPatterns.add(p.id);
        render();
      },
    },
      el('div', { className: 'pattern-header' },
        el('span', { className: 'pattern-badge', style: `background:${p.badgeColor}` }, p.badge),
        el('span', { className: 'pattern-title' }, p.title),
        el('span', { className: 'pattern-summary' }, p.summary),
        el('span', { className: 'pattern-chevron' }, '▼')
      ),
      el('div', { className: 'pattern-body' },
        el('div', { className: 'pattern-explanation' }, p.explanation),
        el('div', { className: 'examples-title' }, 'Examples'),
        ...examples
      )
    );
  });

  return el('div', { className: 'pattern-grid' }, ...cards);
}

function initBuilder() {
  const allIndices = SENTENCE_BUILDER.map((_, i) => i);
  const eligible = allIndices.filter(i => levelIncluded(SENTENCE_BUILDER[i].level));
  // fall back to all if no exercises match (shouldn't happen but just in case)
  state.builderOrder = shuffle(eligible.length ? eligible : allIndices);
  state.builderIndex = 0;
  state.builderAnswer = [];
  state.builderChecked = false;
  state.builderCorrect = false;
}

function renderBuilder() {
  if (!state.builderOrder.length) initBuilder();

  const ex = SENTENCE_BUILDER[state.builderOrder[state.builderIndex]];
  const pattern = SENTENCE_PATTERNS.find(p => p.id === ex.pattern);
  const tiles = shuffle([...ex.words]);
  const total = SENTENCE_BUILDER.length;
  const done = state.builderIndex;

  // dots
  const dots = Array.from({ length: total }, (_, i) =>
    el('div', { className: 'bdot' + (i < done ? ' done' : i === done ? ' current' : '') })
  );

  // answer area
  const answerTiles = state.builderAnswer.map((w, i) =>
    el('div', {
      className: 'word-tile in-answer',
      onClick: () => {
        if (state.builderChecked) return;
        state.builderAnswer.splice(i, 1);
        render();
      },
    }, w)
  );
  const answerArea = el('div', {
    className: 'builder-answer' + (state.builderAnswer.length ? ' has-words' : ''),
  },
    state.builderAnswer.length
      ? answerTiles
      : el('div', { className: 'builder-placeholder' }, 'Tap words below to build the sentence')
  );

  // source tiles
  const sourceTiles = tiles.map(w => {
    const used = state.builderAnswer.filter(a => a === w).length;
    const available = ex.words.filter(t => t === w).length;
    const exhausted = used >= available;
    return el('div', {
      className: 'word-tile' + (exhausted ? ' disabled' : ''),
      onClick: () => {
        if (state.builderChecked || exhausted) return;
        state.builderAnswer.push(w);
        render();
      },
    }, w);
  });

  // feedback
  let feedback = null;
  if (state.builderChecked) {
    const correctSentence = ex.words.join(' ');
    feedback = el('div', { className: 'builder-feedback ' + (state.builderCorrect ? 'correct' : 'wrong') },
      el('div', { style: 'flex:1' },
        state.builderCorrect ? '✓ Correct!' : '✗ Not quite.',
        state.builderCorrect ? '' : el('div', { className: 'builder-correct-ans' },
          `Correct: ${correctSentence}`
        )
      ),
      mkSpeak(state.builderCorrect ? state.builderAnswer.join(' ') : correctSentence)
    );
  }

  // action buttons
  const checkBtn = el('button', {
    className: 'btn-primary',
    disabled: !state.builderAnswer.length || state.builderChecked,
    onClick: () => {
      const correct = state.builderAnswer.join(' ') === ex.words.join(' ');
      state.builderChecked = true;
      state.builderCorrect = correct;
      if (correct) addXP(2);
      render();
    },
  }, 'Check');

  const nextBtn = el('button', {
    className: 'btn-secondary',
    onClick: () => {
      state.builderIndex = (state.builderIndex + 1) % total;
      state.builderAnswer = [];
      state.builderChecked = false;
      state.builderCorrect = false;
      render();
    },
  }, state.builderIndex + 1 >= total ? '↺ Restart' : 'Skip →');

  const clearBtn = el('button', {
    className: 'btn-danger',
    onClick: () => { state.builderAnswer = []; state.builderChecked = false; render(); },
  }, 'Clear');

  return el('div', { className: 'builder-wrap' },
    el('div', { className: 'builder-progress' },
      el('span', { style: 'font-size:.82rem;color:var(--muted)' }, `${done + 1} / ${total}`),
      el('div', { className: 'builder-dots' }, ...dots)
    ),
    el('div', { className: 'builder-question' },
      el('div', { className: 'bq-label' }, 'Translate into Korean'),
      el('div', { className: 'bq-english' }, ex.english),
      pattern ? el('div', { className: 'bq-pattern' }, `Pattern: ${pattern.title}`) : null
    ),
    answerArea,
    el('div', { className: 'builder-tiles' }, ...sourceTiles),
    feedback,
    el('div', { className: 'builder-actions' }, checkBtn, nextBtn, clearBtn)
  );
}

/* ── Particle Drills ── */
function initParticledrills() {
  const pool = shuffle(PARTICLE_DRILLS.filter(d => levelIncluded(d.level)));
  state.pdItems    = pool;
  state.pdIndex    = 0;
  state.pdScore    = 0;
  state.pdSelected = null;
  state.pdCorrect  = null;
}

function renderParticles() {
  if (!state.pdItems.length) initParticledrills();
  const items = state.pdItems;
  const total = items.length;

  if (state.pdIndex >= total) {
    // Results screen
    const pct = Math.round((state.pdScore / total) * 100);
    const msg = pct === 100 ? '🎉 Perfect!' : pct >= 80 ? '🌟 Excellent!' : pct >= 60 ? '👍 Good job!' : '📚 Keep practicing!';
    return el('div', { style: 'max-width:540px;margin:0 auto;text-align:center;padding:32px 0' },
      el('div', { className: 'section-title' }, '🎯 Particle Drills — Results'),
      el('div', { className: 'score-circle', style: 'margin:28px auto' },
        el('div', { className: 'score-num' }, `${state.pdScore}/${total}`),
        el('div', { className: 'score-label' }, `${pct}%`)
      ),
      el('div', { className: 'score-msg' }, msg),
      el('div', { className: 'score-sub' }, `You got ${state.pdScore} out of ${total} particles correct.`),
      el('div', { className: 'result-actions', style: 'margin-top:24px' },
        el('button', { className: 'btn-primary', onClick: () => { initParticledrills(); render(); } }, '↺ Try Again'),
        el('button', { className: 'btn-secondary', onClick: () => { state.view = 'home'; render(); } }, '🏠 Home')
      )
    );
  }

  const drill = items[state.pdIndex];
  const answered = state.pdSelected !== null;
  const pct = Math.round((state.pdIndex / total) * 100);

  const sentenceEl = el('div', { className: 'drill-sentence' },
    drill.pre,
    el('span', {
      className: 'drill-blank' + (answered ? (state.pdCorrect ? ' answered' : ' wrong-ans') : '')
    }, answered ? drill.answer : '___'),
    drill.post
  );

  const opts = drill.options.map(opt => {
    let cls = 'drill-opt';
    if (answered) {
      if (opt === drill.answer) cls += ' correct';
      else if (opt === state.pdSelected && !state.pdCorrect) cls += ' wrong';
    }
    return el('button', {
      className: cls,
      disabled: answered,
      onClick: () => {
        state.pdSelected = opt;
        state.pdCorrect  = opt === drill.answer;
        if (state.pdCorrect) { state.pdScore++; addXP(1); }
        render();
      },
    }, opt);
  });

  return el('div', {},
    el('div', { className: 'section-title' }, '🎯 Particle Drills'),
    el('div', { className: 'section-subtitle' }, 'Choose the correct particle to fill in the blank'),
    el('div', { className: 'drill-progress-row' },
      el('span', { style: 'font-size:.82rem;color:var(--muted)' }, `${state.pdIndex + 1} / ${total}`),
      el('div', { className: 'drill-score-badge' }, `Score: ${state.pdScore}`),
    ),
    el('div', { className: 'prog-bar', style: 'margin-bottom:22px' },
      el('div', { className: 'prog-fill c1', style: `width:${pct}%` })
    ),
    el('div', { className: 'drill-wrap' },
      el('div', { className: 'drill-sentence-box' },
        el('div', { className: 'drill-label' }, 'Fill in the blank'),
        sentenceEl,
        el('div', { className: 'drill-hint' }, `💡 ${drill.hint}`)
      ),
      el('div', { className: 'drill-options' }, ...opts),
      answered ? (() => {
        const expDiv = document.createElement('div');
        expDiv.className = 'drill-explanation';
        expDiv.innerHTML = state.pdCorrect
          ? `✅ ${drill.explanation}`
          : `❌ Correct answer: <strong>${drill.answer}</strong> — ${drill.explanation}`;
        return expDiv;
      })() : null,
      answered ? el('div', { style: 'text-align:center' },
        el('button', { className: 'btn-primary', onClick: () => {
          state.pdIndex++;
          state.pdSelected = null;
          state.pdCorrect  = null;
          render();
        }}, state.pdIndex + 1 >= total ? 'See Results →' : 'Next →')
      ) : null
    )
  );
}

/* ── Phrasebook ── */
function renderPhrasebook() {
  const cats = ['All', ...new Set(PHRASEBOOK.map(p => p.cat))];
  const phrases = PHRASEBOOK.filter(p => levelIncluded(p.level) &&
    (state.pbCategory === 'All' || p.cat === state.pbCategory));

  const catEmoji = { Travel:'✈️', Food:'🍜', Shopping:'🛍️', Emergency:'🚨', Social:'🙏' };

  const cards = phrases.map(p =>
    el('div', { className: 'phrase-card' },
      el('div', { className: 'phrase-cat-tag' }, `${catEmoji[p.cat] || '📌'} ${p.cat}`),
      el('div', { className: 'phrase-kr' },
        el('span', {}, p.kr),
        mkSpeak(p.kr)
      ),
      el('div', { className: 'phrase-rom' }, p.rom),
      el('div', { className: 'phrase-eng' }, p.eng),
      p.tip ? el('div', { className: 'phrase-tip' }, `💡 ${p.tip}`) : null
    )
  );

  return el('div', {},
    el('div', { className: 'section-title' }, '📖 Phrasebook'),
    el('div', { className: 'section-subtitle' }, 'Essential phrases for real-life Korean situations • Tap 🔊 to hear pronunciation'),
    el('div', { className: 'phrase-filter-bar' },
      ...cats.map(c =>
        el('button', {
          className: 'filter-btn' + (state.pbCategory === c ? ' active' : ''),
          onClick: () => { state.pbCategory = c; render(); },
        }, c === 'All' ? '🗂 All' : `${catEmoji[c] || ''} ${c}`)
      )
    ),
    el('div', { className: 'level-filter-note' },
      `Showing ${phrases.length} phrases at your level — change level on Home screen`
    ),
    el('div', { className: 'phrase-grid' }, ...cards)
  );
}

/* ── K-Pop & Drama Phrases ── */
function renderKpop() {
  const catMeta = {
    songs:  { label: '🎵 Songs',       badge: 'songs'  },
    dramas: { label: '📺 K-Dramas',    badge: 'dramas' },
    fandom: { label: '💜 Fandom',      badge: 'fandom' },
    slang:  { label: '🌐 Slang',       badge: 'slang'  },
  };
  const cats = ['All', 'songs', 'dramas', 'fandom', 'slang'];
  const phrases = KPOP_PHRASES.filter(p =>
    state.kpCategory === 'All' || p.cat === state.kpCategory
  );

  const cards = phrases.map(p => {
    const meta = catMeta[p.cat] || {};
    return el('div', { className: 'kpop-card' },
      el('span', { className: `kpop-cat-badge ${p.cat}` }, meta.label || p.cat),
      el('div', { className: 'kpop-emoji' }, p.emoji),
      el('div', { className: 'kpop-kr' },
        el('span', {}, p.kr),
        mkSpeak(p.kr)
      ),
      el('div', { className: 'kpop-rom' }, p.rom),
      el('div', { className: 'kpop-eng' }, p.eng),
      el('div', { className: 'kpop-context' }, p.context)
    );
  });

  return el('div', {},
    el('div', { className: 'section-title' }, '🎵 K-Pop & Drama Phrases'),
    el('div', { className: 'section-subtitle' }, 'Learn Korean through pop culture — songs, dramas, fandom words & internet slang'),
    el('div', { className: 'kpop-filter-bar' },
      ...cats.map(c =>
        el('button', {
          className: 'filter-btn' + (state.kpCategory === c ? ' active' : ''),
          onClick: () => { state.kpCategory = c; render(); },
        }, c === 'All' ? '🗂 All' : catMeta[c].label)
      )
    ),
    el('div', { className: 'kpop-grid' }, ...cards)
  );
}

/* ── Conjugation Tables ── */
function renderConjugation() {
  const verbs = CONJ_VERBS.filter(v => levelIncluded(v.level));
  if (!state.conjVerbId || !verbs.find(v => v.id === state.conjVerbId)) {
    state.conjVerbId = verbs[0]?.id || null;
  }
  const verb = CONJ_VERBS.find(v => v.id === state.conjVerbId);

  const verbBtns = verbs.map(v =>
    el('button', {
      className: 'conj-verb-btn' + (state.conjVerbId === v.id ? ' active' : ''),
      onClick: () => { state.conjVerbId = v.id; render(); },
    }, v.base)
  );

  if (!verb) {
    return el('div', {},
      el('div', { className: 'section-title' }, '📊 Conjugation Tables'),
      el('div', { style: 'color:var(--muted);padding:32px 0;text-align:center' }, 'No verbs available at your level.')
    );
  }

  const rows = verb.forms.map(f => {
    const [fKr, fRom] = f.formal.split(' / ');
    const [pKr, pRom] = f.polite.split(' / ');
    const [iKr, iRom] = f.informal.split(' / ');
    return el('tr', {},
      el('td', { className: 'conj-row-label' }, f.tense),
      el('td', { className: 'conj-col-formal' },
        el('div', { className: 'conj-cell' },
          el('div', {},
            el('div', { className: 'conj-kr' }, fKr),
            el('div', { className: 'conj-rom' }, fRom || '')
          ),
          mkSpeak(fKr && fKr !== '—' ? fKr : '')
        )
      ),
      el('td', { className: 'conj-col-polite' },
        el('div', { className: 'conj-cell' },
          el('div', {},
            el('div', { className: 'conj-kr' }, pKr),
            el('div', { className: 'conj-rom' }, pRom || '')
          ),
          mkSpeak(pKr)
        )
      ),
      el('td', { className: 'conj-col-informal' },
        el('div', { className: 'conj-cell' },
          el('div', {},
            el('div', { className: 'conj-kr' }, iKr),
            el('div', { className: 'conj-rom' }, iRom || '')
          ),
          mkSpeak(iKr)
        )
      )
    );
  });

  return el('div', {},
    el('div', { className: 'section-title' }, '📊 Conjugation Tables'),
    el('div', { className: 'section-subtitle' }, 'Click a verb to see its full conjugation table • Tap 🔊 to hear any form'),
    el('div', { className: 'conj-verb-list' }, ...verbBtns),
    el('div', { className: 'conj-header' },
      el('div', { style: 'display:flex;align-items:center;gap:12px' },
        el('div', { className: 'conj-base' }, verb.base),
        mkSpeak(verb.base, 'font-size:1.1rem')
      ),
      el('div', { className: 'conj-base-eng' }, verb.baseEng),
      verb.irregular ? el('div', { className: 'conj-irreg-note' }, `⚠️ ${verb.irregular} verb — watch for stem changes`) : null
    ),
    el('div', { className: 'conj-table-wrap' },
      el('table', { className: 'conj-table' },
        el('thead', {},
          el('tr', {},
            el('th', {}, 'Tense'),
            el('th', {}, '📜 Formal'),
            el('th', {}, '😊 Polite'),
            el('th', {}, '👫 Informal')
          )
        ),
        el('tbody', {}, ...rows)
      )
    ),
    el('div', { style: 'display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)' },
      el('span', {}, '📜 Formal = -ㅂ/습니다 (presentations, formal speeches)'),
      el('span', {}, '😊 Polite = -아/어요 (everyday polite speech)'),
      el('span', {}, '👫 Informal = -아/어 (close friends, informal chat)')
    )
  );
}

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown', e => {
  if (state.view === 'flashcard') {
    const words = getFilteredVocab();
    const idx = Math.min(state.fcIndex, words.length - 1);
    if (e.key === 'ArrowRight' && idx < words.length - 1) { state.fcIndex = idx + 1; state.fcFlipped = false; render(); }
    else if (e.key === 'ArrowLeft' && idx > 0) { state.fcIndex = idx - 1; state.fcFlipped = false; render(); }
    else if (e.key === ' ') { e.preventDefault(); state.fcFlipped = !state.fcFlipped; render(); }
  }
});

render();

// ── Register Service Worker (PWA offline support) ──────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        // Check for updates every time the app is opened
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              // New version available — show a subtle indicator
              const toast = document.createElement('div');
              toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#6c63ff;color:#fff;padding:10px 20px;border-radius:10px;font-size:.85rem;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4)';
              toast.textContent = '✨ App updated! Reload for the latest version.';
              document.body.appendChild(toast);
              setTimeout(() => toast.remove(), 5000);
            }
          });
        });
      })
      .catch(() => {}); // Silently ignore SW errors (e.g. local file:// access)
  });
}
</script>
</body>
</html>
