<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국어 배우기 · Learn Korean</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e42;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --muted: #7878a0;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,.4);
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: var(--surface);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-kr { font-size: 1.5rem; }
    nav { display: flex; gap: 6px; }
    nav button {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .875rem; font-weight: 500; transition: all .2s;
    }
    nav button:hover { color: var(--text); border-color: var(--border); }
    nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    main { flex: 1; padding: 32px 24px; max-width: 920px; margin: 0 auto; width: 100%; }

    /* ── Shared ── */
    .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .section-subtitle { color: var(--muted); margin-bottom: 24px; font-size: .9rem; }

    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      padding: 11px 28px; border-radius: 8px; cursor: pointer; font-size: .95rem; font-weight: 600; transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .85; }
    .btn-secondary {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: .9rem; transition: all .2s;
    }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-danger {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .btn-danger:hover { color: var(--accent2); border-color: var(--accent2); }

    /* ── Progress bar ── */
    .prog-bar-wrap { margin-bottom: 6px; }
    .prog-bar-top { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 5px; }
    .prog-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
    .prog-fill.c1 { background: var(--accent); }
    .prog-fill.c2 { background: var(--accent2); }
    .prog-fill.c3 { background: var(--accent3); }

    /* ── Home ── */
    .home-hero { margin-bottom: 36px; }
    .home-hero h1 { font-size: 2.6rem; font-weight: 800; margin-bottom: 6px; }
    .home-hero h1 span { color: var(--accent); }
    .home-hero p { color: var(--muted); font-size: 1rem; }

    .progress-dashboard {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 32px;
    }
    .dashboard-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 18px; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
    .dash-stat { text-align: center; }
    .dash-num { font-size: 2rem; font-weight: 800; }
    .dash-num.c1 { color: var(--accent); }
    .dash-num.c2 { color: var(--accent2); }
    .dash-num.c3 { color: var(--accent3); }
    .dash-label { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .module-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden;
    }
    .module-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .module-card.c1::before { background: var(--accent); }
    .module-card.c2::before { background: var(--accent2); }
    .module-card.c3::before { background: var(--accent3); }
    .module-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
    .module-card .icon { font-size: 2rem; margin-bottom: 12px; }
    .module-card h3 { font-size: 1rem; margin-bottom: 4px; }
    .module-card p { color: var(--muted); font-size: .82rem; line-height: 1.5; margin-bottom: 12px; }
    .module-card .card-prog { }

    /* ── Hangul ── */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 22px; }
    .tab {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 7px 18px; border-radius: 8px; cursor: pointer; font-size: .875rem; transition: all .2s;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .hangul-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .hangul-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 14px; text-align: center; cursor: pointer; transition: all .2s; position: relative;
    }
    .hangul-card:hover { border-color: var(--accent); background: var(--surface2); }
    .hangul-card.studied { border-color: var(--accent3); }
    .studied-badge {
      position: absolute; top: 8px; right: 8px; background: var(--accent3);
      color: #000; font-size: .65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .hangul-char { font-size: 2.8rem; line-height: 1; margin-bottom: 8px; }
    .hangul-rom { font-size: .9rem; font-weight: 600; color: var(--accent); }
    .hangul-sound {
      font-size: .72rem; color: var(--muted); margin-top: 6px; line-height: 1.4;
      max-height: 0; overflow: hidden; transition: max-height .3s;
    }
    .hangul-card.flipped .hangul-sound { max-height: 60px; }
    .hangul-prog-row { margin-bottom: 20px; }

    /* ── Flashcards ── */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .filter-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

    .fc-stats { display: flex; gap: 16px; margin-bottom: 20px; }
    .fc-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: .82rem; }
    .fc-stat span { font-weight: 700; }
    .fc-stat .known { color: var(--accent3); }
    .fc-stat .learning { color: var(--accent2); }

    .flashcard-wrap { perspective: 1000px; }
    .flashcard {
      position: relative; width: 100%; max-width: 480px; margin: 0 auto 20px;
      height: 240px; cursor: pointer; transform-style: preserve-3d; transition: transform .5s ease;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 28px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .card-face.known-card { border-color: var(--accent3); }
    .card-back { transform: rotateY(180deg); }
    .card-korean { font-size: 3.2rem; margin-bottom: 8px; }
    .card-category { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
    .card-hint { font-size: .82rem; color: var(--muted); }
    .card-rom { font-size: 1.3rem; color: var(--accent); margin-bottom: 8px; font-weight: 600; }
    .card-eng { font-size: 1.1rem; color: var(--text); }
    .known-tag { position: absolute; top: 12px; right: 12px; background: var(--accent3); color: #000; font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }

    .card-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
    .nav-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: .875rem; transition: all .2s;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
    .card-counter { color: var(--muted); font-size: .875rem; }

    .know-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
    .btn-know {
      background: #1a3a2a; color: var(--accent3); border: 1px solid var(--accent3);
      padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: .875rem; font-weight: 600; transition: all .2s;
    }
    .btn-know:hover { background: var(--accent3); color: #000; }
    .btn-unlearn {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: .8rem; transition: all .2s;
    }
    .btn-unlearn:hover { border-color: var(--accent2); color: var(--accent2); }
    .card-flip-hint { text-align: center; color: var(--muted); font-size: .78rem; }

    /* ── Quiz ── */
    .quiz-start { text-align: center; padding: 32px 0; }
    .quiz-history {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px;
    }
    .quiz-hist-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 16px; font-size: .82rem; text-align: center; min-width: 80px;
    }
    .quiz-hist-item .h-score { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .quiz-hist-item .h-date { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .quiz-best { margin-bottom: 8px; color: var(--muted); font-size: .9rem; }
    .quiz-best span { color: var(--accent3); font-weight: 700; }

    .quiz-progress { margin-bottom: 22px; }
    .progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
    .progress-label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 7px; }

    .quiz-question {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; text-align: center; margin-bottom: 20px;
    }
    .q-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .q-word { font-size: 3rem; margin-bottom: 6px; }
    .q-rom { font-size: .95rem; color: var(--muted); }

    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .opt-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 14px; border-radius: 10px; cursor: pointer; font-size: .9rem; transition: all .2s; text-align: left;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--surface2); }
    .opt-btn.correct { background: #1a3a2a; border-color: var(--accent3); color: var(--accent3); }
    .opt-btn.wrong { background: #3a1a2a; border-color: var(--accent2); color: var(--accent2); }
    .opt-btn:disabled { cursor: not-allowed; }

    .quiz-feedback {
      text-align: center; padding: 14px; border-radius: 10px; margin-bottom: 18px; font-weight: 600;
    }
    .quiz-feedback.correct { background: #1a3a2a; color: var(--accent3); border: 1px solid var(--accent3); }
    .quiz-feedback.wrong { background: #3a1a2a; color: var(--accent2); border: 1px solid var(--accent2); }

    .quiz-results { text-align: center; padding: 32px 0; }
    .score-circle {
      width: 130px; height: 130px; border-radius: 50%; border: 5px solid var(--accent);
      display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 24px;
    }
    .score-num { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
    .score-label { font-size: .75rem; color: var(--muted); }
    .score-msg { font-size: 1.2rem; margin-bottom: 6px; }
    .score-sub { color: var(--muted); margin-bottom: 24px; }
    .result-actions { display: flex; gap: 10px; justify-content: center; }

    .reset-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }

    /* ── Sentences Module ── */
    .pattern-grid { display: flex; flex-direction: column; gap: 16px; }
    .pattern-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color .2s;
    }
    .pattern-card:hover { border-color: var(--accent); }
    .pattern-card.open { border-color: var(--accent); }
    .pattern-header {
      display: flex; align-items: center; gap: 12px; padding: 18px 20px;
    }
    .pattern-badge {
      font-size: .7rem; font-weight: 700; padding: 3px 10px; border-radius: 12px;
      text-transform: uppercase; letter-spacing: .06em; color: #fff; white-space: nowrap;
    }
    .pattern-title { font-size: 1rem; font-weight: 600; flex: 1; }
    .pattern-summary { font-size: .82rem; color: var(--muted); margin-left: auto; max-width: 340px; text-align: right; }
    .pattern-chevron { color: var(--muted); font-size: .8rem; transition: transform .3s; }
    .pattern-card.open .pattern-chevron { transform: rotate(180deg); }
    .pattern-body { display: none; padding: 0 20px 20px; }
    .pattern-card.open .pattern-body { display: block; }
    .pattern-explanation {
      font-size: .875rem; color: var(--muted); line-height: 1.7;
      padding: 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 16px;
    }
    .examples-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
    .example-row {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .ex-korean { font-size: 1.5rem; margin-bottom: 4px; }
    .ex-rom { font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
    .ex-english { font-size: .9rem; color: var(--text); margin-bottom: 10px; }
    .ex-parts { display: flex; flex-wrap: wrap; gap: 6px; }
    .ex-part {
      font-size: .75rem; padding: 3px 10px; border-radius: 12px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    }
    .ex-part span { color: var(--text); font-weight: 600; }

    /* Builder */
    .builder-wrap { }
    .builder-question {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; text-align: center; margin-bottom: 20px;
    }
    .bq-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .bq-english { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; }
    .bq-pattern { font-size: .78rem; color: var(--accent); }
    .builder-answer {
      min-height: 64px; background: var(--surface2); border: 2px dashed var(--border);
      border-radius: var(--radius); padding: 12px 16px; display: flex;
      flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px;
      transition: border-color .2s;
    }
    .builder-answer.has-words { border-color: var(--accent); border-style: solid; }
    .builder-placeholder { color: var(--muted); font-size: .875rem; margin: auto; }
    .word-tile {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 1rem;
      transition: all .15s; user-select: none;
    }
    .word-tile:hover { border-color: var(--accent); background: var(--surface2); }
    .word-tile.in-answer { background: var(--accent); border-color: var(--accent); color: #fff; }
    .word-tile.in-answer:hover { opacity: .85; }
    .word-tile.disabled { opacity: .3; cursor: not-allowed; }
    .builder-tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .builder-actions { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .builder-feedback {
      padding: 14px 18px; border-radius: 10px; font-weight: 600; font-size: .95rem;
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
    }
    .builder-feedback.correct { background: #1a3a2a; color: var(--accent3); border: 1px solid var(--accent3); }
    .builder-feedback.wrong { background: #3a1a2a; color: var(--accent2); border: 1px solid var(--accent2); }
    .builder-correct-ans { font-size: .85rem; opacity: .85; }
    .builder-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .builder-dots { display: flex; gap: 5px; }
    .bdot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
    .bdot.done { background: var(--accent3); }
    .bdot.current { background: var(--accent); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const HANGUL_CONSONANTS = [
  { char: "ㄱ", romanization: "g/k", sound: "like 'g' in go" },
  { char: "ㄴ", romanization: "n",   sound: "like 'n' in no" },
  { char: "ㄷ", romanization: "d/t", sound: "like 'd' in do" },
  { char: "ㄹ", romanization: "r/l", sound: "between 'r' and 'l'" },
  { char: "ㅁ", romanization: "m",   sound: "like 'm' in me" },
  { char: "ㅂ", romanization: "b/p", sound: "like 'b' in boy" },
  { char: "ㅅ", romanization: "s",   sound: "like 's' in sun" },
  { char: "ㅇ", romanization: "ng/silent", sound: "silent at start, 'ng' at end" },
  { char: "ㅈ", romanization: "j",   sound: "like 'j' in joy" },
  { char: "ㅊ", romanization: "ch",  sound: "like 'ch' in chair" },
  { char: "ㅋ", romanization: "k",   sound: "aspirated 'k'" },
  { char: "ㅌ", romanization: "t",   sound: "aspirated 't'" },
  { char: "ㅍ", romanization: "p",   sound: "aspirated 'p'" },
  { char: "ㅎ", romanization: "h",   sound: "like 'h' in hat" },
];

const HANGUL_VOWELS = [
  { char: "ㅏ", romanization: "a",   sound: "like 'a' in father" },
  { char: "ㅑ", romanization: "ya",  sound: "like 'ya' in yard" },
  { char: "ㅓ", romanization: "eo",  sound: "like 'u' in fun" },
  { char: "ㅕ", romanization: "yeo", sound: "like 'yuh'" },
  { char: "ㅗ", romanization: "o",   sound: "like 'o' in old" },
  { char: "ㅛ", romanization: "yo",  sound: "like 'yo' in yoga" },
  { char: "ㅜ", romanization: "u",   sound: "like 'oo' in food" },
  { char: "ㅠ", romanization: "yu",  sound: "like 'yu' in you" },
  { char: "ㅡ", romanization: "eu",  sound: "no English equivalent" },
  { char: "ㅣ", romanization: "i",   sound: "like 'ee' in see" },
];

const VOCABULARY = [
  // ── Greetings ──────────────────────────────────────────────────────────────
  { korean: "안녕하세요",  romanization: "annyeonghaseyo",  english: "Hello (formal)",        category: "Greetings" },
  { korean: "안녕",       romanization: "annyeong",        english: "Hi / Bye (informal)",   category: "Greetings" },
  { korean: "감사합니다", romanization: "gamsahamnida",    english: "Thank you (formal)",     category: "Greetings" },
  { korean: "고마워요",   romanization: "gomawoyo",        english: "Thank you (casual)",     category: "Greetings" },
  { korean: "죄송합니다", romanization: "joesonghamnida",  english: "I'm sorry (formal)",     category: "Greetings" },
  { korean: "괜찮아요",   romanization: "gwaenchanayo",    english: "It's okay / I'm fine",   category: "Greetings" },
  { korean: "네",         romanization: "ne",              english: "Yes",                    category: "Greetings" },
  { korean: "아니요",     romanization: "aniyo",           english: "No",                     category: "Greetings" },
  { korean: "안녕히 가세요", romanization: "annyeonghi gaseyo", english: "Goodbye (to one leaving)", category: "Greetings" },
  { korean: "만나서 반가워요", romanization: "mannaseo bangawoyo", english: "Nice to meet you", category: "Greetings" },
  { korean: "잘 지내요?", romanization: "jal jinaeyo",    english: "How are you?",            category: "Greetings" },
  { korean: "잘 지내요",  romanization: "jal jinaeyo",    english: "I'm doing well",          category: "Greetings" },

// ── Sentence Builder Exercises ────────────────────────────────────────────────
const SENTENCE_BUILDER = [

// ── Grammar Quiz Questions ────────────────────────────────────────────────────
const GRAMMAR_QUIZ = [

  { q: "Which particle means 'where an ACTION takes place'?",

  { q: "Fill in the blank: 학교___ 가요 (I go to school)",

  { q: "How do you say 'I am a student'? (저, 학생)",

  { q: "What is the correct word order in Korean?",

    opts: ["았어요/었어요", "아요/어요", "겠어요", "이에요"], a: "았어요/었어요",

  { q: "How do you form a yes/no question in Korean?",

    tip: "Korean yes/no questions keep the exact same word order. Just raise your intonation at the end." },

  { q: "Where do question words (뭐, 어디, 언제, 누구) go?",

<script>
/* ── Utilities ── */
function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'className') e.className = v;
    else if (k === 'style' && typeof v === 'string') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null) continue;
    e.append(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── Persistence ── */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
};

// hangul_studied: array of char strings
// vocab_known: array of korean word strings
// quiz_history: array of { score, total, date }

function getStudied() { return new Set(store.get('hangul_studied', [])); }
function setStudied(s) { store.set('hangul_studied', [...s]); }

function getKnown() { return new Set(store.get('vocab_known', [])); }
function setKnown(s) { store.set('vocab_known', [...s]); }

function getQuizHistory(type) { return store.get(`quiz_history_${type}`, []); }
function addQuizResult(type, score, total) {
  const h = getQuizHistory(type);
  h.unshift({ score, total, date: new Date().toLocaleDateString() });
  store.set(`quiz_history_${type}`, h.slice(0, 5));
}

function resetAll() {
  localStorage.removeItem('hangul_studied');
  localStorage.removeItem('vocab_known');
  localStorage.removeItem('quiz_history');
}

/* ── State ── */
const state = {
  view: 'home',
  hangulTab: 'consonants',
  hangulFlipped: new Set(),
  fcCategory: 'All',
  fcIndex: 0,
  fcFlipped: false,
  // quiz
  quizView: 'select',     // select | vocab | grammar
  vqState: 'idle',        // vocab quiz:   idle | active | done
  vqItems: [], vqIndex: 0, vqScore: 0, vqSelected: null, vqCorrect: null,
  gqState: 'idle',        // grammar quiz: idle | active | done
  gqItems: [], gqIndex: 0, gqScore: 0, gqSelected: null, gqCorrect: null,
  sentenceTab: 'patterns',   // patterns | builder
  openPatterns: new Set(),
  builderIndex: 0,
  builderOrder: [],          // indices into SENTENCE_BUILDER (shuffled)
  builderAnswer: [],         // word tiles placed so far
  builderChecked: false,
  builderCorrect: false,
};

/* ── Render ── */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.append(renderHeader(), el('main', {}, renderView()));
}

function renderHeader() {
  const navItems = [
    { id: 'home', label: '🏠 Home' },
    { id: 'hangul', label: '가 Hangul' },
    { id: 'flashcard', label: '📇 Flashcards' },
    { id: 'quiz', label: '✏️ Quiz' },
    { id: 'sentences', label: '📝 Sentences' },
  ];
  return el('header', {},
    el('div', { className: 'logo', onClick: () => { state.view = 'home'; render(); } },
      el('span', { className: 'logo-kr' }, '한'),
      el('span', {}, 'Learn Korean')
    ),
    el('nav', {},
      ...navItems.map(({ id, label }) =>
        el('button', {
          className: state.view === id ? 'active' : '',
          onClick: () => { state.view = id; render(); },
        }, label)
      )
    )
  );
}

function renderView() {
  if (state.view === 'home') return renderHome();
  if (state.view === 'hangul') return renderHangul();
  if (state.view === 'flashcard') return renderFlashcard();
  if (state.view === 'quiz') return renderQuiz();
  if (state.view === 'sentences') return renderSentences();
}

/* ── Home ── */
function renderHome() {
  const studied = getStudied();
  const known = getKnown();
  const vHistory = getQuizHistory('vocab');
  const gHistory = getQuizHistory('grammar');
  const allHistory = [...vHistory, ...gHistory].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  const totalHangul = HANGUL_CONSONANTS.length + HANGUL_VOWELS.length;
  const avgQuiz = allHistory.length
    ? Math.round(allHistory.reduce((s, h) => s + (h.score / h.total) * 100, 0) / allHistory.length)
    : 0;

  const dashboard = el('div', { className: 'progress-dashboard' },
    el('div', { className: 'dashboard-title' }, 'Your Progress'),
    el('div', { className: 'dashboard-grid' },
      el('div', { className: 'dash-stat' },
        el('div', { className: 'dash-num c1' }, `${studied.size}/${totalHangul}`),
        el('div', { className: 'dash-label' }, 'Hangul Studied')
      ),
      el('div', { className: 'dash-stat' },
        el('div', { className: 'dash-num c2' }, `${known.size}/${VOCABULARY.length}`),
        el('div', { className: 'dash-label' }, 'Words Known')
      ),
      el('div', { className: 'dash-stat' },
        el('div', { className: 'dash-num c3' }, allHistory.length ? `${avgQuiz}%` : '—'),
        el('div', { className: 'dash-label' }, 'Quiz Avg')
      )
    ),
    makeProg('Hangul', studied.size, totalHangul, 'c1'),
    el('div', { style: 'height:10px' }),
    makeProg('Vocabulary', known.size, VOCABULARY.length, 'c2'),
    ...[
      el('div', { style: 'height:16px' }),
      el('div', { style: 'display:flex;align-items:center;justify-content:space-between' },
        el('div', { style: 'font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em' }, allHistory.length ? 'Recent Quizzes' : ''),
        el('button', { className: 'btn-danger', onClick: () => { if (confirm('Reset all progress?')) { resetAll(); render(); } } }, 'Reset Progress')
      ),
      ...(allHistory.length ? [
        el('div', { style: 'height:10px' }),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-top:2px' },
          ...allHistory.map(h =>
            el('div', { className: 'quiz-hist-item' },
              el('div', { className: 'h-score' }, `${h.score}/${h.total}`),
              el('div', { className: 'h-date' }, `${h.type || ''} ${h.date}`.trim())
            )
          )
        )
      ] : [])
    ])
  );

  const modules = [
    {
      id: 'hangul', cls: 'c1', icon: '가', title: 'Hangul Alphabet',
      desc: '14 consonants + 10 vowels. Click to reveal pronunciation.',
      prog: makeProg('', studied.size, totalHangul, 'c1', true),
    },
    {
      id: 'flashcard', cls: 'c2', icon: '📇', title: 'Vocabulary Flashcards',
      desc: `${VOCABULARY.length} words across 6 categories. Mark words as known.`,
      prog: makeProg('', known.size, VOCABULARY.length, 'c2', true),
    },
    {
      id: 'quiz', cls: 'c3', icon: '✏️', title: 'Quiz Mode',
      desc: `Vocab quiz + Grammar quiz. ${allHistory.length ? `Best: ${Math.max(...allHistory.map(h => Math.round((h.score/h.total)*100)))}%` : 'No attempts yet.'}`,
      prog: null,
    },
    {
      id: 'sentences', cls: 'c1', icon: '📝', title: 'Sentence Structure',
      desc: `${SENTENCE_PATTERNS.length} grammar patterns + interactive sentence builder.`,
      prog: null,
    },
  ];

  return el('div', {},
    el('div', { className: 'home-hero' },
      el('h1', {}, '한국어 배우기'),
      el('h1', {}, 'Learn ', el('span', {}, 'Korean')),
      el('p', {}, 'Track your progress across all modules')
    ),
    dashboard,
    el('div', { className: 'cards-grid' },
      ...modules.map(m =>
        el('div', { className: `module-card ${m.cls}`, onClick: () => { state.view = m.id; render(); } },
          el('div', { className: 'icon' }, m.icon),
          el('h3', {}, m.title),
          el('p', {}, m.desc),
          m.prog || ''
        )
      )
    )
  );
}

function makeProg(label, val, max, cls, compact = false) {
  const pct = max > 0 ? Math.round((val / max) * 100) : 0;
  return el('div', { className: 'prog-bar-wrap' },
    compact ? '' : el('div', { className: 'prog-bar-top' },
      el('span', {}, label),
      el('span', {}, `${val} / ${max}`)
    ),
    el('div', { className: 'prog-bar' },
      el('div', { className: `prog-fill ${cls}`, style: `width:${pct}%` })
    )
  );
}

/* ── Hangul ── */
function renderHangul() {
  const data = state.hangulTab === 'consonants' ? HANGUL_CONSONANTS : HANGUL_VOWELS;
  const studied = getStudied();
  const total = HANGUL_CONSONANTS.length + HANGUL_VOWELS.length;

  const cards = data.map((item, i) => {
    const key = state.hangulTab + i;
    const flipped = state.hangulFlipped.has(key);
    const isStudied = studied.has(item.char);
    return el('div', {
      className: 'hangul-card' + (flipped ? ' flipped' : '') + (isStudied ? ' studied' : ''),
      onClick: () => {
        if (flipped) state.hangulFlipped.delete(key);
        else {
          state.hangulFlipped.add(key);
          studied.add(item.char);
          setStudied(studied);
        }
        render();
      },
    },
      isStudied ? el('div', { className: 'studied-badge' }, '✓') : null,
      el('div', { className: 'hangul-char' }, item.char),
      el('div', { className: 'hangul-rom' }, item.romanization),
      el('div', { className: 'hangul-sound' }, item.sound)
    );
  });

  return el('div', {},
    el('div', { className: 'section-title' }, 'Hangul Alphabet'),
    el('div', { className: 'section-subtitle' }, 'Click a card to reveal pronunciation • Green border = studied'),
    el('div', { className: 'hangul-prog-row' }, makeProg('Progress', studied.size, total, 'c1')),
    el('div', { className: 'tab-bar' },
      el('button', {
        className: 'tab' + (state.hangulTab === 'consonants' ? ' active' : ''),
        onClick: () => { state.hangulTab = 'consonants'; state.hangulFlipped.clear(); render(); },
      }, `Consonants (자음) — ${HANGUL_CONSONANTS.length}`),
      el('button', {
        className: 'tab' + (state.hangulTab === 'vowels' ? ' active' : ''),
        onClick: () => { state.hangulTab = 'vowels'; state.hangulFlipped.clear(); render(); },
      }, `Vowels (모음) — ${HANGUL_VOWELS.length}`)
    ),
    el('div', { className: 'hangul-grid' }, ...cards)
  );
}

// ── Shared quiz engine ─────────────────────────────────────────────────────
function renderQuizEngine({ items, index, score, selected, correct, total,
  onAnswer, onNext, onRestart, onBack, type }) {

  if (index >= total) {  // done screen
    const pct = Math.round((score / total) * 100);
    const msg = pct === 100 ? '🎉 Perfect!' : pct >= 80 ? '🌟 Excellent!' : pct >= 60 ? '👍 Great job!' : pct >= 40 ? '📚 Keep studying!' : '💪 Don\'t give up!';
    const history = getQuizHistory(type);
    return el('div', { className: 'quiz-results' },
      el('div', { className: 'score-circle' },
        el('div', { className: 'score-num' }, `${score}/${total}`),
        el('div', { className: 'score-label' }, `${pct}%`)
      ),
      el('div', { className: 'score-msg' }, msg),
      el('div', { className: 'score-sub' }, `You got ${score} out of ${total} correct.`),
      history.length > 1 ? el('div', { style: 'margin-bottom:20px' },
        el('div', { style: 'font-size:.78rem;color:var(--muted);margin-bottom:8px' }, 'Your history:'),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center' },
          ...history.map(h =>
            el('div', { className: 'quiz-hist-item' },
              el('div', { className: 'h-score' }, `${h.score}/${h.total}`),
              el('div', { className: 'h-date' }, h.date)
            )
          )
        )
      ) : null,
      el('div', { className: 'result-actions' },
        el('button', { className: 'btn-primary', onClick: onRestart }, 'Try Again'),
        el('button', { className: 'btn-secondary', onClick: onBack }, '← Quiz Menu')
      )
    );
  }

  const item = items[index];
  const answered = selected !== null;
  const pct = (index / total) * 100;

  const opts = item.options.map(opt => {
    let cls = 'opt-btn';
    if (answered) {
      if (opt === item.answer) cls += ' correct';
      else if (opt === selected && opt !== item.answer) cls += ' wrong';
    }
    return el('button', {
      className: cls, disabled: answered,
      onClick: () => onAnswer(opt),
    }, opt);
  });

  return el('div', {},
    el('div', { style: 'display:flex;align-items:center;gap:10px;margin-bottom:16px' },
      el('button', { className: 'btn-danger', onClick: onBack }, '← Back'),
      el('div', { style: 'flex:1' },
        el('div', { className: 'progress-label' },
          el('span', {}, `Question ${index + 1} / ${total}`),
          el('span', {}, `Score: ${score}`)
        ),
        el('div', { className: 'progress-bar' },
          el('div', { className: 'progress-fill', style: `width:${pct}%` })
        )
      )
    ),
    el('div', { className: 'quiz-question' },
      item.label ? el('div', { className: 'q-label' }, item.label) : null,
      el('div', { className: 'q-word' }, item.prompt),
      item.sub ? el('div', { className: 'q-rom' }, item.sub) : null
    ),
    el('div', { className: 'quiz-options' }, ...opts),
    answered ? el('div', { className: `quiz-feedback ${correct ? 'correct' : 'wrong'}` },
      correct ? '✓ Correct!' : `✗ Answer: ${item.answer}`,
      item.tip && !correct ? el('div', { style: 'font-size:.82rem;font-weight:400;margin-top:6px;opacity:.9' }, item.tip) : null
    ) : null,
    answered ? el('div', { style: 'text-align:center' },
      el('button', { className: 'btn-primary', onClick: onNext },
        index + 1 >= total ? 'See Results' : 'Next →')
    ) : null
  );
}

// ── Vocabulary Quiz ────────────────────────────────────────────────────────
function buildVocabItems() {
  const pool = shuffle(VOCABULARY).slice(0, 10);
  return pool.map((word, i) => {
    const k2e = i % 2 === 0; // alternate Korean→English and English→Korean
    if (k2e) {
      const distractors = shuffle(VOCABULARY.filter(w => w.english !== word.english)).slice(0, 3).map(w => w.english);
      return {
        label: 'What does this mean?',
        prompt: word.korean,
        sub: word.romanization,
        options: shuffle([word.english, ...distractors]),
        answer: word.english,
        tip: null,
      };
    } else {
      const distractors = shuffle(VOCABULARY.filter(w => w.korean !== word.korean)).slice(0, 3).map(w => `${w.korean} (${w.romanization})`);
      const answerText = `${word.korean} (${word.romanization})`;
      return {
        label: 'How do you say this in Korean?',
        prompt: word.english,
        sub: `Category: ${word.category}`,
        options: shuffle([answerText, ...distractors]),
        answer: answerText,
        tip: null,
      };
    }
  });
}

function initBuilder() {
  const indices = SENTENCE_BUILDER.map((_, i) => i);
  state.builderOrder = shuffle(indices);
  state.builderIndex = 0;
  state.builderAnswer = [];
  state.builderChecked = false;
  state.builderCorrect = false;
}

function renderBuilder() {
  if (!state.builderOrder.length) initBuilder();

  const ex = SENTENCE_BUILDER[state.builderOrder[state.builderIndex]];
  const pattern = SENTENCE_PATTERNS.find(p => p.id === ex.pattern);
  const tiles = shuffle([...ex.words]);
  const total = SENTENCE_BUILDER.length;
  const done = state.builderIndex;

  // dots
  const dots = Array.from({ length: total }, (_, i) =>
    el('div', { className: 'bdot' + (i < done ? ' done' : i === done ? ' current' : '') })
  );

  // answer area
  const answerTiles = state.builderAnswer.map((w, i) =>
    el('div', {
      className: 'word-tile in-answer',
      onClick: () => {
        if (state.builderChecked) return;
        state.builderAnswer.splice(i, 1);
        render();
      },
    }, w)
  );
  const answerArea = el('div', {
    className: 'builder-answer' + (state.builderAnswer.length ? ' has-words' : ''),
  },
    state.builderAnswer.length
      ? answerTiles
      : el('div', { className: 'builder-placeholder' }, 'Tap words below to build the sentence')
  );

  // source tiles
  const sourceTiles = tiles.map(w => {
    const used = state.builderAnswer.filter(a => a === w).length;
    const available = ex.words.filter(t => t === w).length;
    const exhausted = used >= available;
    return el('div', {
      className: 'word-tile' + (exhausted ? ' disabled' : ''),
      onClick: () => {
        if (state.builderChecked || exhausted) return;
        state.builderAnswer.push(w);
        render();
      },
    }, w);
  });

  // feedback
  let feedback = null;
  if (state.builderChecked) {
    feedback = el('div', { className: 'builder-feedback ' + (state.builderCorrect ? 'correct' : 'wrong') },
      el('div', {},
        state.builderCorrect ? '✓ Correct!' : '✗ Not quite.',
        state.builderCorrect ? '' : el('div', { className: 'builder-correct-ans' },
          `Correct: ${ex.words.join(' ')}`
        )
      )
    );
  }

  // action buttons
  const checkBtn = el('button', {
    className: 'btn-primary',
    disabled: !state.builderAnswer.length || state.builderChecked,
    onClick: () => {
      const correct = state.builderAnswer.join(' ') === ex.words.join(' ');
      state.builderChecked = true;
      state.builderCorrect = correct;
      render();
    },
  }, 'Check');

  const nextBtn = el('button', {
    className: 'btn-secondary',
    onClick: () => {
      state.builderIndex = (state.builderIndex + 1) % total;
      state.builderAnswer = [];
      state.builderChecked = false;
      state.builderCorrect = false;
      render();
    },
  }, state.builderIndex + 1 >= total ? '↺ Restart' : 'Skip →');

  const clearBtn = el('button', {
    className: 'btn-danger',
    onClick: () => { state.builderAnswer = []; state.builderChecked = false; render(); },
  }, 'Clear');

  return el('div', { className: 'builder-wrap' },
    el('div', { className: 'builder-progress' },
      el('span', { style: 'font-size:.82rem;color:var(--muted)' }, `${done + 1} / ${total}`),
      el('div', { className: 'builder-dots' }, ...dots)
    ),
    el('div', { className: 'builder-question' },
      el('div', { className: 'bq-label' }, 'Translate into Korean'),
      el('div', { className: 'bq-english' }, ex.english),
      pattern ? el('div', { className: 'bq-pattern' }, `Pattern: ${pattern.title}`) : null
    ),
    answerArea,
    el('div', { className: 'builder-tiles' }, ...sourceTiles),
    feedback,
    el('div', { className: 'builder-actions' }, checkBtn, nextBtn, clearBtn)
  );
}

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown', e => {
  if (state.view === 'flashcard') {
    const words = getFilteredVocab();
    const idx = Math.min(state.fcIndex, words.length - 1);
    if (e.key === 'ArrowRight' && idx < words.length - 1) { state.fcIndex = idx + 1; state.fcFlipped = false; render(); }
    else if (e.key === 'ArrowLeft' && idx > 0) { state.fcIndex = idx - 1; state.fcFlipped = false; render(); }
    else if (e.key === ' ') { e.preventDefault(); state.fcFlipped = !state.fcFlipped; render(); }
  }
});

render();
</script>
</body>
</html>
